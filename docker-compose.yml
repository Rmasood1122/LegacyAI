# Local development and test database only. The password below is a local-only
# placeholder for a throwaway container; it is not a secret and is used nowhere else.
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: legacyai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-dev-only-not-a-secret
      POSTGRES_DB: legacyai
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legacyai"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql
