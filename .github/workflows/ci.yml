# Continuous integration. Runs on every push and pull request.
# No job here deploys anything, creates any cloud resource, or needs any secret.
# Actions are pinned to full commit hashes (verified 2026-10-02, see docs/DEPENDENCIES.md).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  # Throwaway values for the CI database container only. Not secrets.
  DATABASE_URL_SUPERUSER: postgres://postgres:local-dev-only-not-a-secret@127.0.0.1:55432/legacyai_test
  DATABASE_URL_ADMIN: postgres://legacyai_migrator:local-test-migrator-password@127.0.0.1:55432/legacyai_test
  DATABASE_URL: postgres://legacyai_app:local-test-app-password@127.0.0.1:55432/legacyai_test
  DATABASE_URL_BACKUP: postgres://legacyai_backup:local-test-backup-password@127.0.0.1:55432/legacyai_test
  DATABASE_URL_AI: postgres://legacyai_ai:local-test-ai-svc-password@127.0.0.1:55432/legacyai_test

jobs:
  api:
    name: API - lint, type-check, tests, backup/restore
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - name: Type-check (TypeScript strict)
        run: npm run typecheck
      - name: Lint (includes the SQL-injection, CSPRNG and route-registration rules) and module boundaries
        run: EVIDENCE='no dependency violations' bash ../../scripts/ci-run.sh "lint and module boundaries" npm run lint
      - name: Lint rules really fire (deliberate violations must be rejected)
        run: EVIDENCE='lint-selftest:' bash ../../scripts/ci-run.sh "lint self-test" node ../../scripts/ci-selftest-lint.mjs
      - name: OpenAPI file is valid
        run: npm run lint:openapi
      - name: Start PostgreSQL 18
        run: docker compose -f ../../docker-compose.yml up -d --wait
      - name: OpenAPI sync check (routes in the server == operations in openapi.yaml; responses conform)
        run: EVIDENCE='Test Files|Tests ' bash ../../scripts/ci-run.sh "OpenAPI sync check" npx vitest run test/contract test/security/route-policy-coverage.test.ts
      - name: Unit, integration and security tests against real PostgreSQL, with coverage
        run: EVIDENCE='Test Files|Tests |Statements|Branches|Functions|Lines |ENUMERATION_TIMING|RESOURCE_FILTER_PROPERTY|NO_SECRETS_SCAN' bash ../../scripts/ci-run.sh "all tests with coverage" npm run test:coverage
      - name: Backup -> encrypt -> restore -> verify, with negative controls
        run: EVIDENCE='^selftest:|^restore-test:|^backup:' bash ../../scripts/ci-run.sh "backup/restore self-test" bash ../../scripts/backup-restore-selftest.sh legacyai_test
      - name: Build (compile to JavaScript)
        run: npm run build

  migrations:
    name: Migrations - apply, roll back, re-apply (dbmate and built-in runner agree)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: docker compose -f ../../docker-compose.yml up -d --wait
      - name: Apply, roll back everything, re-apply - with both engines - and compare the resulting schemas
        env:
          REQUIRE_DBMATE: "1"   # in CI dbmate MUST run; a missing binary fails the job instead of skipping the comparison
        run: EVIDENCE='^migrations:' bash ../../scripts/ci-run.sh "migrations check" bash ../../scripts/ci-migrations-check.sh

  ai:
    name: AI service - lint, type-check, tests (fake AI only), dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/ai
    env:
      # Belt and braces: the tests build their own settings with ENVIRONMENT=test, which refuses any real provider.
      ENVIRONMENT: test
      AI_PROVIDER: fake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: EVIDENCE='All checks passed|error' bash ../../scripts/ci-run.sh "ruff" python -m ruff check app tests
      - name: Type-check (mypy, strict)
        run: EVIDENCE='Success|error' bash ../../scripts/ci-run.sh "mypy" python -m mypy app
      - name: Start PostgreSQL 18 and build the schema (roles + every migration)
        working-directory: services/api
        run: |
          npm ci
          docker compose -f ../../docker-compose.yml up -d --wait
          node ../../scripts/db-setup.mjs reset
      - name: Tests - unit, database, leakage, redaction golden set (fake AI provider only)
        run: EVIDENCE='passed|failed|^leakage:|^redaction-golden:' bash ../../scripts/ci-run.sh "AI service tests" python -m pytest -q -p no:cacheprovider
      - name: Dependency vulnerability audit (Python)
        run: EVIDENCE='ulnerabilit' bash ../../scripts/ci-run.sh "pip-audit" python -m pip_audit -r requirements.txt

  dependency-audit:
    name: Dependency vulnerability audit (npm) and dependency record
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit - runtime dependencies, fail on high or critical
        working-directory: services/api
        run: EVIDENCE='ulnerabilit' bash ../../scripts/ci-run.sh "npm audit (runtime dependencies)" npm audit --omit=dev --audit-level=high
      - name: npm audit - all dependencies (reported; does not fail the build)
        working-directory: services/api
        run: npm audit || true
      - name: Every dependency is recorded in docs/DEPENDENCIES.md
        run: EVIDENCE='dependencies-doc:' bash scripts/ci-run.sh "dependency record" node scripts/check-dependencies-doc.mjs

  secret-scan:
    name: Secret scanning (files and full git history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks over the whole history
        run: EVIDENCE='commits scanned|leaks found|scanned' bash scripts/ci-run.sh "gitleaks (full history)" docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --no-banner
      - name: The scanner really fires (a planted fake key must be found)
        run: EVIDENCE='gitleaks-selftest:' bash scripts/ci-run.sh "gitleaks self-test" bash scripts/ci-selftest-gitleaks.sh

  containers:
    name: Container images - build, non-root, fail closed
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t legacyai-api services/api
      - run: docker build -t legacyai-ai services/ai
      - run: docker build -f scripts/backup-tools.Dockerfile -t legacyai-backup-tools scripts
      - name: Images run as a non-root user, and the API refuses to start without configuration
        run: EVIDENCE='^container-checks:' bash scripts/ci-run.sh "container checks" bash scripts/ci-container-checks.sh

  terraform:
    name: Terraform - format and validate (never plan, never apply)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
      - run: terraform fmt -check -recursive
      - name: init without a backend and without credentials
        run: terraform init -backend=false -input=false
      - run: EVIDENCE='valid' bash ../../scripts/ci-run.sh "terraform validate" terraform validate -no-color
      - name: Cost guardrails are present in the code
        run: EVIDENCE='terraform-guardrails:' bash ../../scripts/ci-run.sh "terraform guardrails" bash ../../scripts/ci-terraform-guardrails.sh
      - name: The guardrail check really fires (12 deliberate breaks must each be detected)
        run: EVIDENCE='guardrails-selftest:' bash ../../scripts/ci-run.sh "guardrails self-test" bash ../../scripts/ci-selftest-terraform-guardrails.sh
