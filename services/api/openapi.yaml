        type: string
        maxLength: 60
    FilterResourceType:
      name: resource_type
      in: query
      required: false
      schema:
        type: string
        maxLength: 60
    FilterResourceId:
      name: resource_id
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
    FilterDecision:
      name: decision
      in: query
      required: false
