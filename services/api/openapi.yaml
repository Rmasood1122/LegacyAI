        - actor_card_id
        - actor_kind
        - action
        - resource_type
        - resource_id
        - decision
        - reason_code
        - request_id
        - ip
        - details
        - prev_hash
        - row_hash
      properties:
        seq:
          type: integer
        occurred_at: *a5
        actor_card_id:
          anyOf:
            - *a1
            - type: "null"
        actor_kind:
          type: string
          enum:
            - card
            - system
            - anonymous
            - service
            - operator
        action:
          type: string
        resource_type:
          anyOf:
            - type: string
            - type: "null"
        resource_id:
          anyOf:
            - type: string
            - type: "null"
        decision:
          type: string
          enum:
            - allow
            - deny
            - event
        reason_code:
          type: string
        request_id:
          anyOf:
            - type: string
            - type: "null"
        ip:
          anyOf:
            - type: string
            - type: "null"
        details: *a2
        prev_hash:
          type: string
        row_hash:
          type: string
    AuditVerifyResult:
      type: object
      additionalProperties: false
      required:
        - ok
        - complete
        - rows_checked
        - head_seq
        - head_hash
        - first_broken_seq
        - broken_reason
        - last_anchor
      properties:
        ok:
          type: boolean
        complete:
          type: boolean
          description: False when one call's row limit (20,000) stopped the check early. Call again with from_seq = last checked + 1.
        rows_checked:
          type: integer
        head_seq:
          type: integer
        head_hash:
          anyOf:
            - type: string
            - type: "null"
        first_broken_seq:
          anyOf:
            - type: integer
            - type: "null"
        broken_reason:
          anyOf:
            - type: string
            - type: "null"
        last_anchor:
          anyOf:
            - type: object
              additionalProperties: false
              required:
                - seq
                - anchored_at
                - matches
              properties:
                seq:
                  type: integer
                anchored_at: *a5
                matches:
                  type: boolean
            - type: "null"
