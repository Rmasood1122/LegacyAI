      properties:
        tenant_id:
          type: "string"
          format: "uuid"
        monthly_cap_micro_usd:
          type: "integer"
    KKillSwitch:
      type: "object"
      additionalProperties: false
      required:
        - "on"
        - "reason"
      properties:
        on:
          type: "boolean"
        reason:
          type:
            - "string"
            - "null"
    KStorage:
      type: "object"
      additionalProperties: false
      required:
        - "database_bytes"
        - "total_chunks"
        - "companies"
      properties:
        database_bytes:
          type: "integer"
        total_chunks:
          type: "integer"
        companies:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required:
