                  type:
                    - "integer"
                    - "null"
                used:
                  type: integer
                state:
                  type: string
                  enum: [not_limited, ok, near, reached]
        cards_by_state:
          type: object
          additionalProperties:
            type: integer
        people:
          type: integer
        active_sessions:
          type: integer
        cards_expiring_soon:
          type: integer
        audit_rows:
          type: integer
        logins_last_30_days:
          type: integer
        cards_able_to_unlock:
          type: integer
          description: Active cards that can unlock others. A warning is due when below 2.
        plan:
          type: object
          additionalProperties: false
          required:
            - plan_code
            - max_person_cards
            - max_admin_cards
          properties:
            plan_code:
              type: string
            max_person_cards:
              anyOf:
                - type: integer
                - type: "null"
            max_admin_cards:
              anyOf:
                - type: integer
                - type: "null"
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - seq
        - occurred_at
        - actor_card_id
        - actor_kind
        - action
        - resource_type
        - resource_id
        - decision
        - reason_code
        - request_id
        - ip
        - details
        - prev_hash
        - row_hash
      properties:
        seq:
          type: integer
        occurred_at: *a5
        actor_card_id:
          anyOf:
