          maximum: 60
        renewal_notice_days:
          type: integer
          minimum: 0
          maximum: 60
        sc_lockout_threshold:
          type: integer
          minimum: 3
          maximum: 5
        session_idle_minutes:
          type: integer
          minimum: 5
          maximum: 120
        session_absolute_hours:
          type: integer
          minimum: 1
          maximum: 24
        enabled_roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: *a3
        pilot_reviewer_grant:
          type: boolean
        allowed_factor_types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
