          - issued
          - active
          - suspended
          - revoked
          - expired
          - replaced
      description: Filter by stored state.
    FilterKind:
      name: kind
      in: query
      required: false
      schema:
        type: string
        enum:
          - person
          - company
    FilterPersonId:
      name: person_id
      in: query
      required: false
      schema: *a1
    FilterEventType:
      name: event_type
      in: query
      required: false
      schema:
        type: string
        maxLength: 40
    FilterDepartmentId:
      name: department_id
      in: query
      required: false
