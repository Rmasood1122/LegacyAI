                  - own
    Card:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - card_number
        - state
        - person_id
        - issued_at
        - activated_at
        - expires_at
        - grace_until
        - renewal_due
        - renewal_count
        - locked
        - replaced_by_card_id
        - replaces_card_id
        - roles
      properties:
        id: *a1
        kind:
          type: string
          enum:
            - person
            - company
        card_number:
          type: string
          pattern: ^LGY-[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{4}$
        state: *a4
        person_id:
          anyOf:
            - *a1
            - type: "null"
        issued_at: *a5
        activated_at:
          anyOf:
            - *a5
            - type: "null"
        expires_at: *a5
        grace_until: *a5
        renewal_due: *a5
        renewal_count:
          type: integer
        locked:
          type: boolean
        replaced_by_card_id:
          anyOf:
            - *a1
            - type: "null"
        replaces_card_id:
          anyOf:
            - *a1
            - type: "null"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleAssignment"
    CardWithSecrets:
      type: object
      additionalProperties: false
      required:
        - card
        - secret_already_shown
      properties:
        card:
          $ref: "#/components/schemas/Card"
        sc:
          type: string
          pattern: ^[0-9]{3}$
          description: Shown ONCE. Never stored in readable form, never returned again.
        enrollment_token:
          type: string
          description: Shown ONCE.
        enrollment_token_expires_at: *a5
        secret_already_shown:
          type: boolean
          description: "True on an idempotent replay: the one-time secrets are not repeated."
    IssueCardRequest:
      type: object
      additionalProperties: false
      required:
        - person_id
        - roles
      properties:
        person_id: *a1
        roles:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: "#/components/schemas/RoleAssignmentInput"
    ReasonRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
    ReplaceCardRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          enum:
            - lost
            - damaged
            - compromised
        reset_credentials:
          type: boolean
    RenewCardRequest:
      type: object
      additionalProperties: false
      required: []
      properties:
        validity_days:
          type: integer
          minimum: 1
          maximum: 366
    OwnerRecoveryRequest:
      type: object
      additionalProperties: false
      required:
        - verification_reference
      oneOf:
        - required:
            - card_id
        - required:
            - card_number
      properties:
        card_id: *a1
        card_number: *a6
        verification_reference:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{5,63}$
          description: The id of the operator's own record of the out-of-band identity check (a ticket or case number). An identifier only - never a name, phone number or other personal data. Written to the audit log of both tenants.
    OwnerRecoveryResult:
      type: object
      additionalProperties: false
      required:
        - card
        - secret_already_shown
        - notified_owner_count
      properties:
        card:
          $ref: "#/components/schemas/Card"
        sc:
          type: string
          pattern: ^[0-9]{3}$
          description: Shown ONCE.
        enrollment_token:
          type: string
          description: Shown ONCE.
        enrollment_token_expires_at: *a5
        secret_already_shown:
          type: boolean
          description: "True on an idempotent replay: the one-time secrets are not repeated."
        notified_owner_count:
          type: integer
          minimum: 0
          description: How many other Owners of the company were notified.
    EnrollmentTokenRequest:
      type: object
      additionalProperties: false
      required: []
      properties:
        revoke_existing:
          type: boolean
    EnrollmentTokenResponse:
      type: object
      additionalProperties: false
      required:
        - secret_already_shown
      properties:
        enrollment_token:
          type: string
        enrollment_token_expires_at: *a5
        secret_already_shown:
          type: boolean
    CardEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - card_id
        - occurred_at
        - event_type
        - actor_card_id
        - credential_id
        - device
        - request_id
        - metadata
      properties:
        id: *a1
        card_id: *a1
        occurred_at: *a5
        event_type:
          type: string
        actor_card_id:
          anyOf:
            - *a1
            - type: "null"
        credential_id:
          anyOf:
            - *a1
            - type: "null"
        device:
          anyOf:
            - type: string
              description: Short fingerprint of the device; not an address.
            - type: "null"
        request_id:
          anyOf:
            - type: string
            - type: "null"
        metadata: *a2
    Restriction:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - type
            - enabled
            - config
          properties:
            type:
              type: string
              const: usage_cap
            enabled:
              type: boolean
            config:
              type: object
              additionalProperties: false
              required:
                - limit_key
                - window_seconds
                - max_count
              properties:
                limit_key:
                  type: string
                  enum:
                    - requests
                    - writes
                    - exports
                window_seconds:
                  type: integer
                  minimum: 60
                  maximum: 2678400
                max_count:
                  type: integer
                  minimum: 0
                  maximum: 1000000
        - type: object
          additionalProperties: false
          required:
            - type
            - enabled
            - config
          properties:
            type:
              type: string
              const: time_window
            enabled:
              type: boolean
            config:
              type: object
              additionalProperties: false
              required:
                - timezone
                - days
                - start
                - end
              properties:
                timezone:
                  type: string
                  maxLength: 64
                days:
                  type: array
                  minItems: 1
                  maxItems: 7
                  uniqueItems: true
                  items:
                    type: integer
                    minimum: 0
                    maximum: 6
                start:
                  type: string
                  pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                end:
                  type: string
                  pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        - type: object
          additionalProperties: false
          required:
            - type
            - enabled
            - config
          properties:
            type:
              type: string
              const: network_allowlist
            enabled:
              type: boolean
            config:
              type: object
              additionalProperties: false
              required:
                - cidrs
              properties:
                cidrs:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: string
                    maxLength: 49
                    pattern: ^[0-9A-Fa-f:.]+(/[0-9]{1,3})?$
        - type: object
          additionalProperties: false
          required:
            - type
            - enabled
            - config
          properties:
            type:
              type: string
              const: read_only
            enabled:
              type: boolean
            config:
              type: object
              additionalProperties: false
              required: []
              properties: {}
    PutCardRestrictionsRequest:
      type: object
