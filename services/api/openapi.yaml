        - read_only
        - export_only
        - expires_at
        - grace_until
        - renewal_due
        - session_idle_expires_at
        - session_absolute_expires_at
        - csrf_token
      properties:
        card_id: *a1
        tenant_id: *a1
        person_id:
          description: The person this card belongs to (null for a company card). Lets a client name the signed-in person as the contributor of their own material.
          type:
            - "string"
            - "null"
          format: "uuid"
        card_number_masked:
          type: string
        roles:
          type: array
          items: *a3
        permissions:
          type: array
          items:
            type: string
        card_state: *a4
        read_only:
          type: boolean
        export_only:
          type: boolean
        expires_at: &a5
          type: string
          format: date-time
        grace_until: *a5
        renewal_due: *a5
        session_idle_expires_at: *a5
        session_absolute_expires_at: *a5
        csrf_token:
          type: string
    EnrollmentBeginRequest:
      type: object
