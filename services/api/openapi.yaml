  /v1/topic-templates/{template_key}/apply:
    post:
      operationId: applyTopicTemplate
      summary: Add a template's topics and job-role maps to the company. Adds what is missing; changes nothing that exists.
      description: >-
        A topic whose name already exists is kept as it is (and used for the links if the caller may read it; otherwise
        it is counted as skipped). A link between a job role and a topic that exists is left alone. Applying the same
        template again creates nothing. Two steps: the topics and links are written first; then each new topic gets its
        search vector from the knowledge service. If that second step fails the answer is 502 AND THE TOPICS AND LINKS
        EXIST ALREADY - apply the template again (with a new Idempotency-Key) to complete it; nothing is duplicated.
      tags:
        - knowledge
      x-permission: topic:manage
      security:
        - sessionCookie: []
      x-idempotent: true
      parameters:
        - name: template_key
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{1,39}$"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicTemplateResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-lai_session
  parameters:
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InterviewId:
      name: interview_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestionId:
      name: question_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KnowledgeAnswerId:
      name: "knowledge_answer_id"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
      description: "The answer_id returned by askKnowledge (an answer to a question - not an answer in a readiness test)."
    AnswerId:
      name: answer_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConsentId:
      name: consent_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TopicId:
      name: topic_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TermId:
      name: term_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobRole:
      name: job_role
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/JobRoleName"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9_.:-]+$
      description: Client-chosen key. Same key + same request replays the stored response; same key + different request is a 409.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Page size.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
      description: Opaque cursor from a previous page.
    CardId:
      name: card_id
      in: path
      required: true
      schema: &a1
        type: string
        format: uuid
    PersonId:
      name: person_id
      in: path
      required: true
      schema: *a1
    ExportId:
      name: export_id
      in: path
      required: true
      schema: *a1
    CredentialId:
      name: credential_id
      in: path
      required: true
      schema: *a1
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema: *a1
    RoleKey:
      name: role_key
      in: path
      required: true
      schema: &a3
        type: string
        enum:
          - company_owner
          - admin
          - department_manager
          - auditor
          - reviewer
          - expert
          - successor
          - contractor
    FilterState:
      name: state
      in: query
      required: false
      schema: &a4
        type: string
        enum:
          - issued
          - active
          - suspended
          - revoked
          - expired
          - replaced
      description: Filter by stored state.
    FilterKind:
      name: kind
      in: query
      required: false
      schema:
        type: string
        enum:
          - person
          - company
    FilterPersonId:
      name: person_id
      in: query
      required: false
      schema: *a1
    FilterEventType:
      name: event_type
      in: query
      required: false
      schema:
        type: string
        maxLength: 40
    FilterDepartmentId:
      name: department_id
      in: query
      required: false
      schema: *a1
    FilterPersonStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - active
          - departed
    FilterActorCardId:
      name: actor_card_id
      in: query
      required: false
      schema: *a1
    FilterAction:
      name: action
      in: query
      required: false
      schema:
        type: string
        maxLength: 60
    FilterResourceType:
      name: resource_type
      in: query
      required: false
      schema:
        type: string
        maxLength: 60
    FilterResourceId:
      name: resource_id
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
    FilterDecision:
      name: decision
      in: query
      required: false
      schema:
        type: string
        enum:
          - allow
          - deny
          - event
  responses:
    PayloadTooLarge:
      description: "The file is too large."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadGateway:
      description: "The knowledge service did not answer. Nothing was changed by this request."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AiUnavailable:
      description: "AI is not available right now (switched off, or the budget is used up)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    StorageFull:
      description: "Storage for captured knowledge is full."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The request does not match the contract.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Not signed in, or sign-in failed. Deliberately generic.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Not allowed. Deliberately generic.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such resource (also returned for resources in another tenant).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: "Conflict: illegal state transition, duplicate, or idempotency key reused with a different request."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: The request is well-formed but breaks a rule.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit reached. Uniform response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      headers:
        Retry-After:
          schema:
            type: integer
    Unavailable:
      description: Not ready.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    KSource:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "kind"
        - "title"
        - "department_id"
        - "sensitivity"
        - "contributor_person_id"
        - "company_document"
        - "status"
        - "failure_code"
        - "mime"
        - "byte_size"
        - "page_count"
        - "chunk_count"
        - "created_at"
        - "ready_at"
      properties:
        id:
          type: "string"
          format: "uuid"
        kind:
          type: "string"
          enum:
            - "document"
            - "interview"
        title:
          type: "string"
        department_id:
          type:
            - "string"
            - "null"
          format: "uuid"
        sensitivity:
          type: "integer"
          minimum: 0
          maximum: 3
        contributor_person_id:
          type:
            - "string"
            - "null"
          format: "uuid"
        company_document:
          type: "boolean"
        status:
          type: "string"
        failure_code:
          type:
            - "string"
            - "null"
        mime:
          type:
            - "string"
            - "null"
        byte_size:
          type:
            - "integer"
            - "null"
        page_count:
          type:
            - "integer"
            - "null"
        chunk_count:
          type: "integer"
        created_at:
          type: "string"
          format: "date-time"
        ready_at:
          type:
            - "string"
            - "null"
          format: "date-time"
    KSourceDetail:
      type: "object"
      additionalProperties: false
      required:
        - "redactions"
        - "id"
        - "kind"
        - "title"
        - "department_id"
        - "sensitivity"
        - "contributor_person_id"
        - "company_document"
        - "status"
        - "failure_code"
        - "mime"
        - "byte_size"
        - "page_count"
        - "chunk_count"
        - "created_at"
        - "ready_at"
      properties:
        id:
          type: "string"
          format: "uuid"
        kind:
          type: "string"
          enum:
            - "document"
            - "interview"
        title:
          type: "string"
        department_id:
          type:
            - "string"
            - "null"
          format: "uuid"
        sensitivity:
          type: "integer"
          minimum: 0
          maximum: 3
        contributor_person_id:
          type:
            - "string"
            - "null"
          format: "uuid"
        company_document:
          type: "boolean"
        status:
          type: "string"
        failure_code:
          type:
            - "string"
            - "null"
        mime:
          type:
            - "string"
            - "null"
        byte_size:
          type:
            - "integer"
            - "null"
        page_count:
          type:
            - "integer"
            - "null"
        chunk_count:
          type: "integer"
        created_at:
          type: "string"
          format: "date-time"
        ready_at:
          type:
            - "string"
            - "null"
          format: "date-time"
        redactions:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required:
              - "type"
              - "count"
              - "low_confidence"
            properties:
              type:
                type: "string"
              count:
                type: "integer"
              low_confidence:
                type: "integer"
    KSourceCreated:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "status"
        - "title"
      properties:
        id:
          type: "string"
          format: "uuid"
        status:
          type: "string"
        title:
          type: "string"
    KUploadResult:
      type: "object"
      additionalProperties: false
      required:
        - "status"
        - "failure_code"
        - "chunk_count"
        - "pending_chunks"
        - "duplicate_of"
      properties:
        status:
          type: "string"
          enum:
            - "ready"
            - "processing"
            - "failed"
        failure_code:
          type:
            - "string"
            - "null"
        chunk_count:
          type:
            - "integer"
            - "null"
        pending_chunks:
          type:
            - "integer"
            - "null"
        duplicate_of:
          type:
            - "string"
            - "null"
          format: "uuid"
    KStatus:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "status"
      properties:
        id:
          type: "string"
          format: "uuid"
        status:
          type: "string"
    KSourceWithdrawn:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "status"
        - "items_withdrawn"
        - "items_back_in_review"
      properties:
        id:
          type: "string"
          format: "uuid"
        status:
          type: "string"
        items_withdrawn:
          type: "integer"
        items_back_in_review:
          type: "integer"
    KLabelResult:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "rows"
      properties:
        id:
          type: "string"
          format: "uuid"
        rows:
          type: "integer"
    KCitation:
      type: "object"
      additionalProperties: false
      required:
        - "ref"
        - "kind"
        - "id"
        - "title"
        - "snippet"
        - "verification_status"
        - "expert_display_name"
        - "derived_from"
      properties:
        ref:
          type: "string"
        kind:
          type: "string"
          enum:
            - "item"
            - "source"
        id:
          type: "string"
          format: "uuid"
        title:
          type: "string"
        snippet:
          type: "string"
        verification_status:
          type: "string"
        expert_display_name:
          type:
            - "string"
            - "null"
        derived_from:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required:
              - "source_id"
              - "title"
            properties:
              source_id:
                type: "string"
                format: "uuid"
              title:
                type: "string"
    KAnswer:
      type: "object"
      additionalProperties: false
      required:
        - "outcome"
        - "answer"
        - "reason"
        - "confidence"
        - "contains_unverified_sources"
        - "citations"
        - "can_ask_expert"
        - "answer_id"
        - "conflict_found_by"
        - "conflicts"
        - "conflict_check_partial"
      properties:
        answer_id:
          type:
            - "string"
            - "null"
          format: "uuid"
          description: "The record of this answer, for giving feedback on it (putAnswerFeedback). Null only if the answer could not be recorded; feedback is then not possible."
        conflict_found_by:
          type:
            - "string"
            - "null"
          enum:
            - "value_check"
            - "ai_model"
            - null
          description: "Null unless the reason is sources_conflict. Then: who found the conflict - 'value_check' (the comparison of stated values, done in code after the model answered) or 'ai_model' (the model itself said its sources disagree)."
        conflicts:
          type: "array"
          description: "What the value check found to disagree, in the sources' own words (at most 5). Only sources this card may read are compared. AN EMPTY LIST DOES NOT MEAN THE SOURCES AGREE: the check reads numbers with units, intervals, rates, counts and plain must / must-not sentences in English. It does not catch contradictions in prose without such a value, values written as words, values spread over several sentences, tables whose header carries the meaning, or other languages; and when the model itself reported the conflict the list may be empty."
          items:
            $ref: "#/components/schemas/KSourceConflict"
        conflict_check_partial:
          type: "boolean"
          description: "True when the value check reached one of its size limits and did not read all of the material."
        outcome:
          $ref: "#/components/schemas/KAnswerOutcome"
        answer:
          type:
            - "string"
            - "null"
        reason:
          $ref: "#/components/schemas/KAnswerReason"
        confidence:
          $ref: "#/components/schemas/KAnswerConfidence"
        contains_unverified_sources:
          type: "boolean"
        citations:
          type: "array"
          items:
            $ref: "#/components/schemas/KCitation"
        can_ask_expert:
          type: "boolean"
    KFeedbackVerdict:
      type: "string"
      enum:
        - "helpful"
        - "unhelpful"
        - "wrong"
    KAnswerOutcome:
      type: "string"
      enum:
        - "answered"
        - "dont_know"
        - "search_only"
    KAnswerReason:
      type:
        - "string"
        - "null"
      enum:
        - "no_relevant_sources"
        - "not_grounded"
        - "sources_conflict"
        - "low_confidence"
        - "budget_exhausted"
        - "ai_disabled"
        - "ai_unavailable"
        - "grace"
        - null
      description: "Why there is no written answer; null when there is one."
    KAnswerConfidence:
      type:
        - "string"
        - "null"
      enum:
        - "high"
        - "medium"
        - null
    KConflictMeasure:
      type: "string"
      description: "What kind of value differs. 'requirement' = one source says must, the other must not."
      enum:
        - "time"
        - "pressure"
        - "torque"
        - "length"
        - "mass"
        - "volume"
        - "percent"
        - "rotation"
        - "frequency"
        - "power"
        - "voltage"
        - "current"
        - "ppm"
        - "concentration"
        - "temperature"
        - "interval"
        - "rate"
        - "count"
        - "requirement"
    KConflictSide:
      type: "object"
      additionalProperties: false
      description: "One of the two statements that disagree. kind and id are the same as in a citation, so a client can link to the source."
      required:
        - "kind"
        - "id"
        - "title"
        - "value"
      properties:
        kind:
          type: "string"
          enum:
            - "item"
            - "source"
        id:
          type: "string"
          format: "uuid"
        title:
          type: "string"
        value:
          type: "string"
          description: "The words as written in the source, e.g. '3.2 bar', 'every 30 minutes'."
    KSourceConflict:
      type: "object"
      additionalProperties: false
      required:
        - "measure"
        - "a"
        - "b"
      properties:
        measure:
          $ref: "#/components/schemas/KConflictMeasure"
        a:
          $ref: "#/components/schemas/KConflictSide"
        b:
          $ref: "#/components/schemas/KConflictSide"
    KItemConflict:
      type: "object"
      additionalProperties: false
      description: "A verified item this item disagrees with. When the other item is one this card may not read, there is ONE entry with restricted = true and nothing else: not the measure, not either value, not how many such items there are."
      required:
        - "restricted"
        - "measure"
        - "this"
        - "other"
        - "detected_at"
      properties:
        restricted:
          type: "boolean"
        measure:
          oneOf:
            - $ref: "#/components/schemas/KConflictMeasure"
            - type: "null"
        this:
          oneOf:
            - $ref: "#/components/schemas/KConflictSide"
            - type: "null"
        other:
          oneOf:
            - $ref: "#/components/schemas/KConflictSide"
            - type: "null"
        detected_at:
          type:
            - "string"
            - "null"
          format: "date-time"
    KQualityWeek:
      type: "object"
      additionalProperties: false
      required:
        - "week_start"
        - "questions"
        - "answered"
        - "search_only"
        - "dont_know"
        - "dont_know_no_relevant_sources"
        - "dont_know_not_grounded"
        - "dont_know_low_confidence"
        - "dont_know_sources_conflict"
        - "conflicts_found_by_value_check"
        - "conflicts_found_by_ai_model"
        - "citations_removed"
        - "answers_naming_an_unknown_source"
        - "answers_containing_unverified_sources"
        - "feedback_helpful"
        - "feedback_unhelpful"
        - "feedback_wrong"
      properties:
        week_start:
          type: "string"
          format: "date"
        questions:
          type: "integer"
        answered:
          type: "integer"
        search_only:
          type: "integer"
        dont_know:
          type: "integer"
        dont_know_no_relevant_sources:
          type: "integer"
        dont_know_not_grounded:
          type: "integer"
        dont_know_low_confidence:
          type: "integer"
        dont_know_sources_conflict:
          type: "integer"
        conflicts_found_by_value_check:
          type: "integer"
        conflicts_found_by_ai_model:
          type: "integer"
        citations_removed:
          type: "integer"
        answers_naming_an_unknown_source:
          type: "integer"
        answers_containing_unverified_sources:
          type: "integer"
        feedback_helpful:
          type: "integer"
        feedback_unhelpful:
          type: "integer"
        feedback_wrong:
          type: "integer"
    KQualitySummary:
      type: "object"
      additionalProperties: false
      required:
        - "weeks"
        - "kept_for_days"
        - "waiting_for_review"
      properties:
        weeks:
          type: "array"
          items:
            $ref: "#/components/schemas/KQualityWeek"
        kept_for_days:
          type: "integer"
          description: "The company's answer-log retention: older answers and their feedback are deleted and no longer counted."
        waiting_for_review:
          type: "object"
          additionalProperties: false
          required:
            - "item_conflicts"
            - "stale_items"
            - "answers_marked_wrong"
          properties:
            item_conflicts:
              type: "integer"
            stale_items:
              type: "integer"
            answers_marked_wrong:
              type: "integer"
    KAnswerFeedback:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "answer_id"
        - "verdict"
        - "comment"
        - "question_shared"
        - "question"
        - "created_at"
        - "outcome"
        - "reason"
        - "confidence"
        - "contains_unverified_sources"
      properties:
        id:
          type: "string"
          format: "uuid"
        answer_id:
          type: "string"
          format: "uuid"
        verdict:
          $ref: "#/components/schemas/KFeedbackVerdict"
        comment:
          type:
            - "string"
            - "null"
        question_shared:
          type: "boolean"
          description: "Whether the reader chose to let the people who look after quality see the question."
        question:
          type:
            - "string"
            - "null"
          description: "The question the answer was for, with personal details blanked out. Null unless the reader shared it."
        created_at:
          type: "string"
          format: "date-time"
        outcome:
          $ref: "#/components/schemas/KAnswerOutcome"
        reason:
          $ref: "#/components/schemas/KAnswerReason"
        confidence:
          $ref: "#/components/schemas/KAnswerConfidence"
        contains_unverified_sources:
          type: "boolean"
    KItemSummary:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "title"
        - "status"
        - "origin"
        - "ai_extracted"
        - "department_id"
        - "sensitivity"
        - "owner_person_id"
        - "usage_count"
        - "verified_at"
        - "stale_after"
        - "updated_at"
      properties:
        id:
          type: "string"
          format: "uuid"
        title:
          type: "string"
        status:
          type: "string"
        origin:
          type: "string"
        ai_extracted:
          type: "boolean"
        department_id:
          type:
            - "string"
            - "null"
          format: "uuid"
        sensitivity:
          type: "integer"
          minimum: 0
          maximum: 3
        owner_person_id:
          type:
            - "string"
            - "null"
          format: "uuid"
        usage_count:
          type: "integer"
        verified_at:
          type:
            - "string"
            - "null"
          format: "date-time"
        stale_after:
          type:
            - "string"
            - "null"
          format: "date-time"
        updated_at:
          type: "string"
          format: "date-time"
    KItemDetail:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "title"
        - "status"
        - "origin"
        - "ai_extracted"
        - "department_id"
        - "sensitivity"
        - "owner_person_id"
        - "usage_count"
        - "verified_at"
        - "stale_after"
        - "updated_at"
        - "body"
        - "self_verified"
        - "versions"
        - "provenance"
        - "topics"
        - "conflicts"
      properties:
        conflicts:
          type: "array"
          description: "Verified items that state a different value for the same thing (found by the value check among items sharing a topic). AN EMPTY LIST DOES NOT MEAN NOTHING DISAGREES: the check reads numbers with units, intervals, rates, counts and plain must / must-not sentences in English, compares only items linked to a common topic, and does not catch contradictions in prose."
          items:
            $ref: "#/components/schemas/KItemConflict"
        id:
          type: "string"
          format: "uuid"
        title:
          type: "string"
        status:
          type: "string"
        origin:
          type: "string"
        ai_extracted:
          type: "boolean"
        department_id:
          type:
            - "string"
            - "null"
          format: "uuid"
        sensitivity:
          type: "integer"
          minimum: 0
          maximum: 3
        owner_person_id:
          type:
            - "string"
            - "null"
          format: "uuid"
        usage_count:
          type: "integer"
        verified_at:
          type:
            - "string"
            - "null"
          format: "date-time"
        stale_after:
          type:
            - "string"
            - "null"
          format: "date-time"
        updated_at:
          type: "string"
          format: "date-time"
        body:
          type: "string"
        self_verified:
          type: "boolean"
        versions:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required:
              - "version_no"
              - "change_kind"
              - "author_person_id"
              - "created_at"
              - "erased_at"
              - "current"
            properties:
              version_no:
                type: "integer"
              change_kind:
                type: "string"
              author_person_id:
                type:
                  - "string"
                  - "null"
                format: "uuid"
              created_at:
                type: "string"
                format: "date-time"
              erased_at:
                type:
                  - "string"
                  - "null"
                format: "date-time"
              current:
                type: "boolean"
        provenance:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required:
              - "source_id"
              - "title"
              - "page_from"
              - "page_to"
            properties:
              source_id:
                type: "string"
                format: "uuid"
              title:
                type: "string"
              page_from:
                type:
                  - "integer"
                  - "null"
              page_to:
                type:
                  - "integer"
                  - "null"
        topics:
          description: "The topics this item is linked to, limited to topics the reader may see. Links to retired topics are left out (they are kept, and are not changed by setting the topics)."
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required:
              - "topic_id"
              - "name"
              - "link_source"
            properties:
              topic_id:
                type: "string"
                format: "uuid"
              name:
                type: "string"
              link_source:
                type: "string"
                enum:
                  - "similarity"
                  - "reviewer"
    KItemTopics:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "topics"
      properties:
        id:
          type: "string"
          format: "uuid"
        topics:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required:
              - "topic_id"
              - "name"
              - "link_source"
            properties:
              topic_id:
                type: "string"
                format: "uuid"
              name:
                type: "string"
              link_source:
                type: "string"
                enum:
                  - "similarity"
                  - "reviewer"
    KVersionCreated:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "status"
        - "version_no"
      properties:
        id:
          type: "string"
          format: "uuid"
        status:
          type: "string"
        version_no:
          type: "integer"
    KCount:
      type: "object"
      additionalProperties: false
      required:
        - "count"
      properties:
        count:
          type: "integer"
    KRestricted:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "sensitivity"
      properties:
        id:
          type: "string"
          format: "uuid"
        sensitivity:
          type: "integer"
          minimum: 0
          maximum: 3
    KInterview:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "expert_person_id"
        - "job_role"
        - "status"
        - "turn_count"
        - "max_turns"
        - "created_at"
        - "last_turn_at"
        - "completed_at"
      properties:
        id:
          type: "string"
