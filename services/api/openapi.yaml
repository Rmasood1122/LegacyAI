                  type: integer
                  minimum: 60
                  maximum: 2678400
                max_count:
                  type: integer
                  minimum: 0
                  maximum: 1000000
        - type: object
          additionalProperties: false
          required:
            - type
            - enabled
            - config
          properties:
            type:
              type: string
              const: time_window
            enabled:
              type: boolean
            config:
              type: object
