  /v1/topic-templates/{template_key}/apply:
    post:
      operationId: applyTopicTemplate
      summary: Add a template's topics and job-role maps to the company. Adds what is missing; changes nothing that exists.
      description: >-
        A topic whose name already exists is kept as it is (and used for the links if the caller may read it; otherwise
        it is counted as skipped). A link between a job role and a topic that exists is left alone. Applying the same
        template again creates nothing. Two steps: the topics and links are written first; then each new topic gets its
        search vector from the knowledge service. If that second step fails the answer is 502 AND THE TOPICS AND LINKS
        EXIST ALREADY - apply the template again (with a new Idempotency-Key) to complete it; nothing is duplicated.
      tags:
        - knowledge
      x-permission: topic:manage
      security:
        - sessionCookie: []
      x-idempotent: true
      parameters:
        - name: template_key
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{1,39}$"
