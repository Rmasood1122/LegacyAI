        - active_sessions
        - cards_expiring_soon
        - audit_rows
        - logins_last_30_days
        - cards_able_to_unlock
        - plan
        - seats
      properties:
        seats:
          description: The seats paid for this term and how many are taken. Null when the company has no term. This - not `plan.max_person_cards`, which is not a billing limit and is null for every plan - is what limits issuing cards.
