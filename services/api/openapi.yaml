        owner_person_id:
          type:
            - "string"
            - "null"
          format: "uuid"
        usage_count:
          type: "integer"
        verified_at:
          type:
            - "string"
            - "null"
          format: "date-time"
        stale_after:
          type:
            - "string"
            - "null"
          format: "date-time"
        updated_at:
          type: "string"
          format: "date-time"
    KItemDetail:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "title"
        - "status"
        - "origin"
        - "ai_extracted"
        - "department_id"
        - "sensitivity"
        - "owner_person_id"
        - "usage_count"
        - "verified_at"
        - "stale_after"
        - "updated_at"
        - "body"
        - "self_verified"
        - "versions"
        - "provenance"
        - "topics"
        - "conflicts"
      properties:
        conflicts:
          type: "array"
          description: "Verified items that state a different value for the same thing (found by the value check among items sharing a topic). AN EMPTY LIST DOES NOT MEAN NOTHING DISAGREES: the check reads numbers with units, intervals, rates, counts and plain must / must-not sentences in English, compares only items linked to a common topic, and does not catch contradictions in prose."
          items:
            $ref: "#/components/schemas/KItemConflict"
        id:
          type: "string"
          format: "uuid"
        title:
          type: "string"
        status:
          type: "string"
        origin:
          type: "string"
        ai_extracted:
          type: "boolean"
        department_id:
          type:
            - "string"
            - "null"
          format: "uuid"
        sensitivity:
          type: "integer"
          minimum: 0
          maximum: 3
        owner_person_id:
          type:
            - "string"
            - "null"
          format: "uuid"
        usage_count:
          type: "integer"
        verified_at:
          type:
            - "string"
            - "null"
          format: "date-time"
        stale_after:
          type:
            - "string"
            - "null"
          format: "date-time"
        updated_at:
          type: "string"
          format: "date-time"
        body:
          type: "string"
        self_verified:
          type: "boolean"
        versions:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required:
              - "version_no"
              - "change_kind"
              - "author_person_id"
              - "created_at"
              - "erased_at"
              - "current"
            properties:
              version_no:
                type: "integer"
              change_kind:
                type: "string"
              author_person_id:
                type:
                  - "string"
                  - "null"
                format: "uuid"
              created_at:
                type: "string"
                format: "date-time"
              erased_at:
                type:
                  - "string"
                  - "null"
                format: "date-time"
              current:
                type: "boolean"
        provenance:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required:
              - "source_id"
              - "title"
              - "page_from"
              - "page_to"
            properties:
              source_id:
                type: "string"
                format: "uuid"
              title:
                type: "string"
              page_from:
                type:
                  - "integer"
                  - "null"
              page_to:
                type:
                  - "integer"
                  - "null"
        topics:
