            - type: object
              additionalProperties: false
              required:
                - type
                - assertion
              properties:
                type:
                  type: string
                  const: passkey
                assertion: *a2
            - type: object
              additionalProperties: false
              required:
                - type
                - code
              properties:
                type:
                  type: string
                  const: totp
                code:
                  type: string
                  pattern: ^[0-9]{6}$
