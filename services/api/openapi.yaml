                type:
                  - "boolean"
                  - "null"
    KScenarioAttemptStep:
      type: "object"
      description: "One step of a run. What is PRESENT depends on the run's `status` and on who reads. Status `in_progress` (or any status a client does not know): only `answer_id`, `position`, `prompt`, `answer_text` - for everyone. For the LEARNER: `final_score`, `decided_by` and `graded_with_low_confidence` only when the run is `graded`; `points` and `read_these` only when it is `graded` AND the company shows answers after grading. A run that is `submitted` (a step waits for a person) or `expired` shows the learner nothing but their own text. For a reader who may read results and is not the learner: scores, `points` and `read_these` in every finished state (`submitted`, `graded`, `expired`). The expected points are never present while a run is in progress."
      additionalProperties: false
      required:
        - "answer_id"
        - "position"
        - "prompt"
        - "answer_text"
      properties:
        answer_id:
          type: "string"
          format: "uuid"
        position:
          type: "integer"
        prompt:
          type: "string"
        answer_text:
          type:
            - "string"
            - "null"
        details_removed:
          type: "boolean"
          description: "Present and true when the retention period has removed the learner's words and what the model said about them."
        final_score:
          type:
            - "number"
            - "null"
          description: "Only when the run is `graded`."
        decided_by:
          type:
            - "string"
            - "null"
          enum:
            - "auto"
            - "ai"
            - "reviewer"
            - null
        graded_with_low_confidence:
          type: "boolean"
          description: "The AI graded this step but was unsure; a reviewer may want to look."
        read_these:
          type: "array"
          description: "Only when the run is `graded` and the points are released to the reader: the linked items the READER may read."
          items:
            type: "object"
            additionalProperties: false
            required:
              - "id"
              - "title"
            properties:
              id:
                type: "string"
                format: "uuid"
              title:
                type: "string"
        points:
          type: "array"
          description: "Only when the run is `graded`: for people who may read results; for the learner only if the company shows answers after grading."
          items:
            type: "object"
            additionalProperties: false
            required:
              - "text"
              - "met"
            properties:
              text:
                type: "string"
              met:
                type:
                  - "boolean"
                  - "null"
                description: "Null when a person, not the AI, decided the score."
    KScenarioAttempt:
