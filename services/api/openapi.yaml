  /v1/tenants/current/anomaly-settings:
    get:
      operationId: getAnomalySettings
      summary: The company's anomaly-lock rules and thresholds (the defaults if nothing was changed).
      description: >-
        Kept apart from the general settings (getTenantSettings) because they have their own audit entries - one per
        changed value, with the old and the new value. Same permission. What the rules count: see updateAnomalySettings.
      tags:
        - tenants
      x-permission: tenant_settings:read
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalySettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      operationId: updateAnomalySettings
      summary: Change the anomaly-lock rules. Values outside the allowed ranges are rejected, not adjusted.
      description: >-
        Rule "denials": this many COUNTED refusals of requests made with a live session of ONE card inside the window
        lock that card. Counted are refusals that suggest probing - no right to the action, outside the card's scope
        or level, acting on someone who outranks it. NOT counted: refusals of ordinary use (a card outside its hours,
        network or limit, read-only, in its grace period; a lapsed company), "not found", failed sign-ins (the
        secret-code lockout handles those), and verifying one's own work. A signed-in request that a page of another
        address made the browser send (Sec-Fetch-Site cross-site or same-site without an allowed Origin) is refused
        before any rule is asked and counts nothing. One refusal fewer than the threshold in every window is never caught:
        the rule finds bursts, not slow probing. Rule "second address": a successful sign-in from another network
        address while a session of the same card was used from a different one within the window locks the card. It
        compares addresses, it knows nothing about geography, and it relies on the service knowing the real client
        address. A locked card is unlocked by an admin with unlockCard, as after wrong secret codes. The last usable
        Owner card of a company is never locked by a rule. Each changed value is recorded in the audit log with its
        old and new value.
      tags:
        - tenants
      x-permission: tenant_settings:update
      security:
        - sessionCookie: []
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAnomalySettingsRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalySettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/anomalies:
