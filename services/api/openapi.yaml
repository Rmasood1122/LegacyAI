          type: array
          minItems: 1
          uniqueItems: true
          items: *a3
        pilot_reviewer_grant:
          type: boolean
        allowed_factor_types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - passkey
              - totp
      minProperties: 1
    TenantUsage:
