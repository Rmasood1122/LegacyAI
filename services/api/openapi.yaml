        - sc
        - factor
      properties:
        login_txn:
          type: string
          minLength: 20
          maxLength: 200
        sc: &a7
          type: string
          pattern: ^[0-9]{3}$
          description: 3-digit secret code. Only ever a second factor.
        factor:
          description: REQUIRED strong factor. Card number + SC alone never authenticates.
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - type
                - assertion
              properties:
                type:
                  type: string
                  const: passkey
                assertion: *a2
            - type: object
              additionalProperties: false
              required:
                - type
                - code
              properties:
                type:
                  type: string
                  const: totp
                code:
                  type: string
                  pattern: ^[0-9]{6}$
