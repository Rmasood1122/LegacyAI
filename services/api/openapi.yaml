          format: "uuid"
        rows:
          type: "integer"
    KCitation:
      type: "object"
      additionalProperties: false
      required:
        - "ref"
        - "kind"
        - "id"
        - "title"
        - "snippet"
        - "verification_status"
        - "expert_display_name"
        - "derived_from"
      properties:
        ref:
          type: "string"
        kind:
          type: "string"
          enum:
            - "item"
            - "source"
        id:
          type: "string"
          format: "uuid"
        title:
          type: "string"
        snippet:
          type: "string"
        verification_status:
          type: "string"
        expert_display_name:
          type:
            - "string"
            - "null"
        derived_from:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required:
              - "source_id"
              - "title"
            properties:
              source_id:
                type: "string"
                format: "uuid"
              title:
                type: "string"
    KAnswer:
      type: "object"
      additionalProperties: false
      required:
        - "outcome"
        - "answer"
        - "reason"
        - "confidence"
        - "contains_unverified_sources"
        - "citations"
        - "can_ask_expert"
        - "answer_id"
        - "conflict_found_by"
        - "conflicts"
        - "conflict_check_partial"
      properties:
        answer_id:
          type:
            - "string"
            - "null"
          format: "uuid"
          description: "The record of this answer, for giving feedback on it (putAnswerFeedback). Null only if the answer could not be recorded; feedback is then not possible."
        conflict_found_by:
          type:
            - "string"
            - "null"
          enum:
            - "value_check"
            - "ai_model"
            - null
          description: "Null unless the reason is sources_conflict. Then: who found the conflict - 'value_check' (the comparison of stated values, done in code after the model answered) or 'ai_model' (the model itself said its sources disagree)."
        conflicts:
          type: "array"
          description: "What the value check found to disagree, in the sources' own words (at most 5). Only sources this card may read are compared. AN EMPTY LIST DOES NOT MEAN THE SOURCES AGREE: the check reads numbers with units, intervals, rates, counts and plain must / must-not sentences in English. It does not catch contradictions in prose without such a value, values written as words, values spread over several sentences, tables whose header carries the meaning, or other languages; and when the model itself reported the conflict the list may be empty."
          items:
            $ref: "#/components/schemas/KSourceConflict"
        conflict_check_partial:
          type: "boolean"
          description: "True when the value check reached one of its size limits and did not read all of the material."
        outcome:
          $ref: "#/components/schemas/KAnswerOutcome"
        answer:
          type:
            - "string"
            - "null"
        reason:
          $ref: "#/components/schemas/KAnswerReason"
        confidence:
          $ref: "#/components/schemas/KAnswerConfidence"
        contains_unverified_sources:
          type: "boolean"
        citations:
          type: "array"
          items:
            $ref: "#/components/schemas/KCitation"
        can_ask_expert:
          type: "boolean"
    KFeedbackVerdict:
      type: "string"
      enum:
        - "helpful"
        - "unhelpful"
        - "wrong"
    KAnswerOutcome:
      type: "string"
      enum:
        - "answered"
        - "dont_know"
        - "search_only"
    KAnswerReason:
      type:
        - "string"
        - "null"
      enum:
        - "no_relevant_sources"
        - "not_grounded"
        - "sources_conflict"
        - "low_confidence"
        - "budget_exhausted"
        - "ai_disabled"
        - "ai_unavailable"
        - "grace"
        - null
      description: "Why there is no written answer; null when there is one."
    KAnswerConfidence:
      type:
        - "string"
        - "null"
      enum:
        - "high"
        - "medium"
        - null
    KConflictMeasure:
      type: "string"
      description: "What kind of value differs. 'requirement' = one source says must, the other must not."
      enum:
        - "time"
        - "pressure"
        - "torque"
        - "length"
        - "mass"
        - "volume"
        - "percent"
        - "rotation"
        - "frequency"
        - "power"
        - "voltage"
        - "current"
        - "ppm"
        - "concentration"
        - "temperature"
        - "interval"
        - "rate"
        - "count"
        - "requirement"
    KConflictSide:
      type: "object"
      additionalProperties: false
      description: "One of the two statements that disagree. kind and id are the same as in a citation, so a client can link to the source."
      required:
        - "kind"
        - "id"
        - "title"
        - "value"
      properties:
        kind:
          type: "string"
          enum:
            - "item"
            - "source"
        id:
          type: "string"
          format: "uuid"
        title:
          type: "string"
        value:
          type: "string"
          description: "The words as written in the source, e.g. '3.2 bar', 'every 30 minutes'."
    KSourceConflict:
      type: "object"
      additionalProperties: false
      required:
        - "measure"
        - "a"
        - "b"
      properties:
        measure:
          $ref: "#/components/schemas/KConflictMeasure"
        a:
          $ref: "#/components/schemas/KConflictSide"
        b:
          $ref: "#/components/schemas/KConflictSide"
    KItemConflict:
      type: "object"
      additionalProperties: false
      description: "A verified item this item disagrees with. When the other item is one this card may not read, there is ONE entry with restricted = true and nothing else: not the measure, not either value, not how many such items there are."
      required:
        - "restricted"
        - "measure"
        - "this"
        - "other"
        - "detected_at"
      properties:
        restricted:
          type: "boolean"
        measure:
          oneOf:
            - $ref: "#/components/schemas/KConflictMeasure"
            - type: "null"
        this:
          oneOf:
            - $ref: "#/components/schemas/KConflictSide"
            - type: "null"
        other:
          oneOf:
            - $ref: "#/components/schemas/KConflictSide"
            - type: "null"
        detected_at:
          type:
            - "string"
            - "null"
          format: "date-time"
    KQualityWeek:
      type: "object"
      additionalProperties: false
      required:
        - "week_start"
        - "questions"
        - "answered"
        - "search_only"
        - "dont_know"
        - "dont_know_no_relevant_sources"
        - "dont_know_not_grounded"
        - "dont_know_low_confidence"
        - "dont_know_sources_conflict"
        - "conflicts_found_by_value_check"
        - "conflicts_found_by_ai_model"
        - "citations_removed"
        - "answers_naming_an_unknown_source"
        - "answers_containing_unverified_sources"
        - "feedback_helpful"
        - "feedback_unhelpful"
        - "feedback_wrong"
      properties:
        week_start:
          type: "string"
          format: "date"
        questions:
          type: "integer"
        answered:
          type: "integer"
        search_only:
          type: "integer"
        dont_know:
          type: "integer"
        dont_know_no_relevant_sources:
          type: "integer"
        dont_know_not_grounded:
          type: "integer"
        dont_know_low_confidence:
          type: "integer"
        dont_know_sources_conflict:
          type: "integer"
        conflicts_found_by_value_check:
          type: "integer"
        conflicts_found_by_ai_model:
          type: "integer"
        citations_removed:
          type: "integer"
        answers_naming_an_unknown_source:
          type: "integer"
        answers_containing_unverified_sources:
          type: "integer"
        feedback_helpful:
          type: "integer"
        feedback_unhelpful:
          type: "integer"
        feedback_wrong:
          type: "integer"
    KActivity:
      type: "object"
      additionalProperties: false
      required: ["months", "items_now", "job_role_results"]
      properties:
        months:
          type: "array"
          description: "Newest first; the first entry is the current, unfinished month. Every month of the range is present."
          items:
            $ref: "#/components/schemas/KActivityMonth"
        items_now:
          type: "object"
          additionalProperties: false
          description: "The items the caller may read, as they stand now."
          required: ["verified", "stale_items", "not_yet_verified"]
          properties:
            verified:
              type: "integer"
              description: "Verified or corrected."
            stale_items:
              type: "integer"
              description: "Items whose verification has run out, among the items the caller may read. getQualitySummary has a counter of the same name in `waiting_for_review`: that one counts open review tasks for stale items in the whole company, so the two can differ."
            not_yet_verified:
              type: "integer"
              description: "Captured or in review, not yet verified."
        job_role_results:
          $ref: "#/components/schemas/KActivityJobRoleResults"
    KActivityMonth:
      type: "object"
      additionalProperties: false
      required: ["month_start", "documents_added", "items_captured", "items_verified", "median_hours_to_verify", "interviews_completed", "tests_handed_in"]
      properties:
        month_start:
          type: "string"
          format: "date"
          description: "The first day of the calendar month (UTC), as week_start names a week in getQualitySummary."
        documents_added:
          type: "integer"
        items_captured:
          type: "integer"
        items_verified:
          type: "integer"
          description: "Items verified in this month that are still verified, corrected or stale."
        median_hours_to_verify:
          type: ["number", "null"]
          description: "Median HOURS from capture to verification for those items; null when none was verified in the month."
        interviews_completed:
          type: ["integer", "null"]
          description: "Interviews finished in this month that the caller may read. Null (not 0) when the caller does not hold the right to read interviews at all."
        tests_handed_in:
          type: ["integer", "null"]
          description: "Readiness tests handed in this month that the caller may read results of. Null (not 0) when the caller does not hold the right to read test results at all."
    KActivityJobRoleResults:
      type: "object"
      additionalProperties: false
      description: "Readiness test results per job role, protected so that one person's result cannot be read off. (1) Only for a caller who may read the test results of the whole company; otherwise `state` is not_allowed and `rows` is empty. (2) ONE fixed window, the 12 complete calendar months before the current one (UTC), whatever `months` was asked for, so two requests cannot be subtracted from each other. (3) A job role gets numbers only with at least `minimum_group` different people in that window. (4) The mean is rounded to one decimal. What this does NOT prevent: comparing the table before and after a new test was graded shows that a test was added and roughly moved the mean. That is accepted because the only cards that receive the table may already read every single result."
      required: ["state", "window_start", "window_end", "minimum_group", "max_rows", "truncated", "rows"]
      properties:
        state:
          type: "string"
          enum: ["shown", "not_allowed"]
          description: "not_allowed: the caller may not read the whole company's test results, so there is no table."
        window_start:
          type: "string"
          format: "date"
          description: "First day of the window (UTC), inclusive."
        window_end:
          type: "string"
          format: "date"
          description: "First day of the current month (UTC), exclusive: the current month is not in the window."
        minimum_group:
          type: "integer"
          description: "The smallest number of different people for which numbers are shown (5)."
        max_rows:
          type: "integer"
          description: "At most this many job roles are listed, in name order (100)."
        truncated:
          type: "boolean"
          description: "True when there are more job roles than `max_rows`."
        rows:
          type: "array"
          items:
            $ref: "#/components/schemas/KActivityJobRole"
    KActivityJobRole:
      type: "object"
      additionalProperties: false
      required: ["job_role", "state", "people", "attempts", "mean_score"]
      properties:
        job_role:
          type: "string"
        state:
          type: "string"
          enum: ["shown", "too_few_people", "no_graded_answers"]
          description: "shown: all numbers are given. too_few_people: fewer than `minimum_group` different people took a graded test for this job role in the window - people, attempts and mean_score are null on purpose (suppressed, not zero). no_graded_answers: enough people, but none of their answers has a score yet - people and attempts are given, mean_score is null."
        people:
          type: ["integer", "null"]
          description: "Different people with a graded test in the window. Null only when state is too_few_people."
        attempts:
          type: ["integer", "null"]
          description: "Graded tests in the window. Null only when state is too_few_people."
        mean_score:
          type: ["number", "null"]
          description: "Mean score of the graded answers, 0 to 1, rounded to one decimal. Not a pass mark: the product defines none. Null unless state is shown."
    KGraphNodeKind:
      type: "string"
      enum: ["topic", "item", "source", "job_role"]
    KGraphNodeRef:
      type: "object"
      additionalProperties: false
      description: "Names one node. An id is unique within its kind only (a job role's id is its name), so a node is always named by kind AND id."
      required: ["kind", "id"]
      properties:
        kind:
          $ref: "#/components/schemas/KGraphNodeKind"
        id:
          type: "string"
    KGraphNode:
      type: "object"
      additionalProperties: false
      required: ["kind", "id", "label", "status"]
      properties:
        kind:
          $ref: "#/components/schemas/KGraphNodeKind"
        id:
          type: "string"
          description: "The id of the topic, item or document; for a job role, its name. Unique within its kind only."
        label:
          type: "string"
          description: "The name or title, with personal details blanked out as everywhere."
        status:
          description: "For an item: its state (the same values as the status filter of listKnowledgeItems). Null for other kinds."
          oneOf:
            - $ref: "#/components/schemas/KItemStatus"
            - type: "null"
    KItemStatus:
      type: "string"
      enum: ["candidate", "in_review", "verified", "corrected", "rejected", "stale"]
    KGraphEdgeKind:
      type: "string"
      enum: ["item_topic", "item_source", "job_role_topic", "item_conflict"]
      description: "item_topic: from an item to a topic it belongs to. item_source: from an item to a document it cites. job_role_topic: from a job role to a topic it needs. item_conflict: two verified items that state different values - it has NO direction; by convention the item with the smaller id is `from`."
    KGraphEdgeOrigin:
      description: "How a link between an item and a topic was made: by similarity of the texts, or by a reviewer. Null for every other kind of link."
      oneOf:
        - type: "string"
          enum: ["similarity", "reviewer"]
        - type: "null"
    KGraphNeighbour:
      type: "object"
      additionalProperties: false
      required: ["node", "origin"]
      properties:
        node:
          $ref: "#/components/schemas/KGraphNode"
        origin:
          $ref: "#/components/schemas/KGraphEdgeOrigin"
    KGraphGroup:
      type: "object"
      additionalProperties: false
      required: ["group", "edge_kind", "truncated", "nodes"]
      properties:
        group:
          type: "string"
          enum: ["topics", "items", "sources", "job_roles", "conflicting_items"]
        edge_kind:
          $ref: "#/components/schemas/KGraphEdgeKind"
        truncated:
          type: "boolean"
          description: "True when this group has more nodes the caller may read than the 50 listed. The others cannot be fetched through this operation; open one of the listed nodes, or use the list screens."
        nodes:
          type: "array"
          description: "Empty when nothing is linked OR when everything linked is hidden from the caller: the two are not told apart, on purpose."
          items:
            $ref: "#/components/schemas/KGraphNeighbour"
    KGraphNeighbourhood:
      type: "object"
      additionalProperties: false
      required: ["node", "neighbours", "limit_per_group"]
      properties:
        node:
          $ref: "#/components/schemas/KGraphNode"
        neighbours:
          type: "array"
          description: "Only the groups this kind of node has, in a fixed order."
          items:
            $ref: "#/components/schemas/KGraphGroup"
        limit_per_group:
          type: "integer"
          description: "The cap of every group (50)."
    KGraphEdge:
      type: "object"
      additionalProperties: false
      required: ["kind", "from", "to", "origin"]
      properties:
        kind:
          $ref: "#/components/schemas/KGraphEdgeKind"
        from:
          $ref: "#/components/schemas/KGraphNodeRef"
        to:
          $ref: "#/components/schemas/KGraphNodeRef"
        origin:
          $ref: "#/components/schemas/KGraphEdgeOrigin"
    KGraphExport:
      type: "object"
      additionalProperties: false
      description: "The exported file. Every edge joins two nodes that are in the file. No text of items or documents, no people."
      required: ["schema", "nodes", "edges", "truncated", "limits"]
      properties:
        schema:
          type: "string"
          const: "legacyai-knowledge-graph/1"
          description: "The name and version of this shape."
        nodes:
          type: "array"
          items:
            $ref: "#/components/schemas/KGraphNode"
        edges:
          type: "array"
          items:
            $ref: "#/components/schemas/KGraphEdge"
        truncated:
          type: "boolean"
          description: "True when a cap in `limits` was reached, so the file is not the whole map."
        limits:
          type: "object"
          additionalProperties: false
          required: ["nodes_per_kind", "edges"]
          properties:
            nodes_per_kind:
              type: "integer"
              description: "At most this many nodes of each kind: items, topics, documents, job roles (2000)."
            edges:
              type: "integer"
              description: "At most this many links of all kinds together (10000)."
    KQualitySummary:
      type: "object"
      additionalProperties: false
      required:
        - "weeks"
        - "kept_for_days"
        - "waiting_for_review"
      properties:
        weeks:
          type: "array"
          items:
            $ref: "#/components/schemas/KQualityWeek"
        kept_for_days:
          type: "integer"
          description: "The company's answer-log retention: older answers and their feedback are deleted and no longer counted."
        waiting_for_review:
          type: "object"
          additionalProperties: false
          required:
            - "item_conflicts"
            - "stale_items"
            - "answers_marked_wrong"
          properties:
            item_conflicts:
              type: "integer"
            stale_items:
              type: "integer"
            answers_marked_wrong:
              type: "integer"
    KAnswerFeedback:
      type: "object"
      additionalProperties: false
      required:
        - "id"
