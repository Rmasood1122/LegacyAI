  /v1/analytics/activity:
    get:
      operationId: "getActivity"
      summary: "Activity numbers for each of the last `months` calendar months (UTC, newest first; the first entry is the current month, which is not over), the items as they stand now, and test results per job role. These count what was done in the product; they are not business outcomes. EVERY number is narrowed by the caller's own rights: documents and items by its right to read knowledge, interviews by its right to read interviews (an interview has the level of what it captured), tests by its right to read test results. A number the caller has no right to at all is null - never the company's total. Test results per job role use one fixed window that does not depend on `months` (see KActivityJobRoleResults). Counts of questions and answers are in getQualitySummary (per week)."
      tags:
        - "knowledge"
      x-permission: "knowledge_settings:read"
      security:
        - sessionCookie: []
      parameters:
        - name: "months"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 24
            default: 6
          description: "How many calendar months (UTC), counting the current one. Every month of the range is returned, also one in which nothing happened."
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
