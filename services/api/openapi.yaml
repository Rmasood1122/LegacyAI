  /v1/retirement-radar:
    get:
      operationId: getRetirementRadar
      summary: People who leave in less than 24 months, soonest first, with what the system holds from each.
      description: >-
        Narrowed like the list of people: a card that may read only its own person sees only its own entry. Ordered by
        leaving date, then person; paged like every list. Job roles and the two counts come from the knowledge side and
        are narrowed by the caller's rights THERE: a count covers only what the caller may read, and is null when the
        caller may not read that kind of thing at all. The counts say how many verified items the person contributed
        and how many interviews were completed - not which topics are still uncaptured; the gap report of each job
        role shows that.
      tags:
        - people
      x-permission: person:read
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                  - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RadarEntry"
                  next_cursor:
                    type:
                      - "string"
                      - "null"
        "400":
          $ref: "#/components/responses/BadRequest"
