  /v1/billing/subscription:
    get:
      operationId: getSubscription
      summary: "The renewal center: the company's plan, seats, renewal date, what is due and what happens if nothing is done."
      description: >-
        The company's term is the company card's validity - one date for the whole company. The fields `expires_at`,
        `renewal_due`, `grace_until`, `read_only` and `export_only` mean exactly what they mean in the session
        (getSession); `phase` is the same in one word: `normal` (too early to renew), `renewal_open` (from
        `renewal_due`), `grace` (after `expires_at`: read-only) and `lapsed` (after `grace_until`: export only).
        Plan names and prices are placeholders until the founder sets them (`plan.placeholder` is true). Amounts
        are whole numbers in the smallest unit of the currency. No tax is added or shown. The path is
        `/v1/billing/...` and not `/v1/tenants/current/...` on purpose: billing is its own area with its own rights.
      tags:
        - billing
      x-permission: billing:read
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      operationId: updateSubscription
      summary: Ask for a number of seats, or switch automatic renewal.
      description: >-
        `seats` is what the Owner ASKS for. Fewer seats than the term already covers take effect at the next
        renewal (never fewer than the cards in use that day). More seats than the term covers must be paid before
        they count: `due_now` then shows a `seats` invoice for the added seats at the full price per seat for the
        term (no proration), issued by startRenewal. While an invoice is waiting to be paid, seats cannot change
        (409 `seats-locked`). Fewer seats than cards in use is refused (409 `seats-below-use`). Only the platform
        operator can remove the seat limit; when the operator did, 409 `seats-set-by-operator`. Automatic renewal
        can only be switched on when a payment provider is connected (409 `payments-unavailable`).
      tags:
        - billing
      x-permission: billing:manage
      security:
        - sessionCookie: []
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriptionRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/billing/invoices:
    get:
      operationId: listInvoices
      summary: The company's invoices, newest first.
      tags:
        - billing
      x-permission: billing:read
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                  - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invoice"
                  next_cursor:
                    type:
                      - "string"
                      - "null"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/billing/invoices/{invoice_id}:
    get:
      operationId: getInvoice
      summary: One invoice. Read it again to learn what became of a payment.
      tags:
        - billing
      x-permission: billing:read
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/billing/renewals:
    post:
      operationId: startRenewal
      summary: Issue the invoice for what is due now and ask the payment provider to collect it.
      description: >-
        What is due is what `due_now` in the subscription says: from `renewal_due` on, the next term (a new term
        starts on the day it takes effect; days left are not carried over); before that, seats the Owner added.
        Nothing due: 409 `renewal-not-open`. No price for the company's plan: 409 `plan-not-in-catalogue`.
        A company has at most one unpaid invoice. If one is open for exactly the same thing it is returned (200,
        `already_open` true); if it is for anything else it is closed and a new one issued, so an old amount is
        never collected. The invoice is stored BEFORE the provider is asked: if the
        provider refuses the request the answer is 502 `payment-provider-error`, if it does not answer in time 503
        `payment-provider-unavailable` - in both cases the invoice exists, nothing was charged, and asking again
        collects the same invoice. The answer never says "paid": the provider reports the outcome later
        (receivePaymentEvent). To learn the final state, read the invoice (getInvoice) or the subscription again.
        An amount of 0 is settled at once. With no provider connected (`collected_by` is `operator`) the invoice
        waits until the platform operator records the payment.
      tags:
        - billing
      x-permission: billing:manage
      security:
        - sessionCookie: []
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The invoice that is now waiting (or, for an amount of 0, already settled). `already_open` says whether it existed before.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenewalStarted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          description: "The payment provider refused the request (`payment-provider-error`). The invoice is open; nothing was charged."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "The payment provider did not answer in time (`payment-provider-unavailable`). The invoice is open; nothing was charged."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/billing/provider-events:
    post:
      operationId: receivePaymentEvent
      summary: "For the payment provider only: a signed message saying an invoice was paid or declined."
      description: >-
        No session. A body that is not the documented shape answers 400 (that says nothing about a signature).
        A well-formed message is accepted only with a valid signature (HMAC-SHA256 over every field, made with a key
        only the provider and the API hold) and a time of sending within five minutes of now; every message that is
        not accepted gets the same 403, whatever the reason - also when no payment provider is connected. An
        accepted message is always answered 200, so the provider stops sending it: `applied` (the invoice was paid
        and took effect, or was marked declined), `duplicate` (this event id was seen before; nothing changed),
        `recorded` (the message is stored and changed nothing by itself: an unknown invoice or company, another
        amount or currency than was due, a payment for an invoice that was already closed, declined or paid, or a
        payment that could not take effect - in every such case the platform operator and the company's Owner are
        told, and the money is never applied silently). "paid" for an open invoice takes effect exactly once.
      tags:
        - billing
      x-public: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentEventRequest"
      responses:
        "200":
          description: The message was accepted (see `status`).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - applied
                      - duplicate
                      - recorded
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/tenants/{tenant_id}/billing:
    get:
      operationId: getTenantBilling
      summary: "Platform operator only: a company's subscription and its invoices, newest first."
      tags:
        - billing
      x-permission: billing:operate
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantBilling"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      operationId: setTenantSeatLimit
      summary: "Platform operator only: set a company's seat limit, or remove it."
      description: >-
        `seat_limit: null` removes the limit (the company may hold any number of person cards, and a renewal bills
        the cards in use that day). Nobody but the operator can do that. A number below the cards in use is refused
        (409 `seats-below-use`). Written to the company's audit log as an operator action and to the operator's own.
      tags:
        - billing
      x-permission: billing:operate
      security:
        - sessionCookie: []
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeatLimitRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/tenants/{tenant_id}/billing/manual-payments:
    post:
      operationId: recordManualPayment
      summary: "Platform operator only: settle an invoice whose payment arrived some other way, or apply a payment that is on record."
      description: >-
        The operator names the invoice and what was paid. Another amount or currency than the invoice says is
        refused (409 `amount-mismatch`). The invoice must be open, or paid and not yet in effect (`applied` false:
        a payment that arrived late or could not be applied); anything else is 409 `invoice-not-payable`. An
        invoice is settled once, whatever idempotency key is used. A renewal starts the new term TODAY: while the
        running term still has days left the request is refused (409 `days-would-be-lost`) unless
        `discard_remaining_days` is true. `reference` says where the payment is recorded (a transfer or case id);
        it must not contain a long run of digits - no payment card number is ever stored. The company's audit log
        records an operator action; the operator's own log names the card.
      tags:
        - billing
      x-permission: billing:operate
      security:
        - sessionCookie: []
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualPaymentRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-lai_session
  parameters:
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InterviewId:
      name: interview_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestionId:
      name: question_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScenarioId:
      name: "scenario_id"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    ScenarioAttemptId:
      name: "scenario_attempt_id"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    ScenarioAnswerId:
      name: "scenario_answer_id"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    KnowledgeAnswerId:
      name: "knowledge_answer_id"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
      description: "The answer_id returned by askKnowledge (an answer to a question - not an answer in a readiness test)."
    AnswerId:
      name: answer_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConsentId:
      name: consent_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TopicId:
      name: topic_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TermId:
      name: term_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobRole:
      name: job_role
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/JobRoleName"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9_.:-]+$
      description: Client-chosen key. Same key + same request replays the stored response; same key + different request is a 409.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Page size.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
      description: Opaque cursor from a previous page.
    CardId:
      name: card_id
      in: path
      required: true
      schema: &a1
        type: string
        format: uuid
    PersonId:
      name: person_id
      in: path
      required: true
      schema: *a1
    ExportId:
      name: export_id
      in: path
      required: true
      schema: *a1
    CredentialId:
      name: credential_id
      in: path
      required: true
      schema: *a1
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema: *a1
    InvoiceId:
      name: invoice_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleKey:
      name: role_key
