                  maxItems: 7
                  uniqueItems: true
                  items:
                    type: integer
                    minimum: 0
                    maximum: 6
                start:
                  type: string
                  pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                end:
                  type: string
                  pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        - type: object
          additionalProperties: false
          required:
            - type
            - enabled
            - config
          properties:
            type:
              type: string
              const: network_allowlist
