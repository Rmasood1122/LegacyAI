        - "verdict"
        - "comment"
        - "question_shared"
        - "question"
        - "created_at"
        - "outcome"
        - "reason"
        - "confidence"
        - "contains_unverified_sources"
      properties:
        id:
          type: "string"
          format: "uuid"
        answer_id:
          type: "string"
          format: "uuid"
        verdict:
