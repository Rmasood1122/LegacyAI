            - max_admin_cards
          properties:
            plan_code:
              type: string
            max_person_cards:
              anyOf:
                - type: integer
                - type: "null"
            max_admin_cards:
              anyOf:
                - type: integer
                - type: "null"
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - seq
        - occurred_at
        - actor_card_id
        - actor_kind
        - action
        - resource_type
        - resource_id
        - decision
        - reason_code
        - request_id
        - ip
        - details
        - prev_hash
        - row_hash
      properties:
        seq:
          type: integer
        occurred_at: *a5
        actor_card_id:
          anyOf:
            - *a1
            - type: "null"
        actor_kind:
          type: string
          enum:
            - card
            - system
            - anonymous
            - service
            - operator
        action:
          type: string
        resource_type:
          anyOf:
            - type: string
            - type: "null"
        resource_id:
          anyOf:
            - type: string
            - type: "null"
        decision:
          type: string
          enum:
            - allow
            - deny
            - event
        reason_code:
          type: string
        request_id:
          anyOf:
            - type: string
            - type: "null"
        ip:
          anyOf:
            - type: string
            - type: "null"
        details: *a2
        prev_hash:
          type: string
        row_hash:
          type: string
    AuditVerifyResult:
      type: object
      additionalProperties: false
      required:
        - ok
        - complete
        - rows_checked
        - head_seq
        - head_hash
        - first_broken_seq
        - broken_reason
        - last_anchor
      properties:
        ok:
          type: boolean
        complete:
          type: boolean
          description: False when one call's row limit (20,000) stopped the check early. Call again with from_seq = last checked + 1.
        rows_checked:
          type: integer
        head_seq:
          type: integer
        head_hash:
          anyOf:
            - type: string
            - type: "null"
        first_broken_seq:
          anyOf:
            - type: integer
            - type: "null"
        broken_reason:
          anyOf:
            - type: string
            - type: "null"
        last_anchor:
          anyOf:
            - type: object
              additionalProperties: false
              required:
                - seq
                - anchored_at
                - matches
              properties:
                seq:
                  type: integer
                anchored_at: *a5
                matches:
                  type: boolean
            - type: "null"
    ExportJob:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - format
        - manifest
        - created_at
        - completed_at
      properties:
        id: *a1
        status:
          type: string
          enum:
            - queued
            - running
            - done
            - failed
        format:
          type: string
        manifest:
          anyOf:
            - *a2
            - type: "null"
        created_at: *a5
        completed_at:
          anyOf:
            - *a5
            - type: "null"
    AnomalySettings:
      type: object
      additionalProperties: false
      description: >-
        "Off" is always a switch, never a special number: every number here is a usable value even while its rule is off.
      required:
        - enabled
        - denials_enabled
        - denials_threshold
        - denials_window_minutes
        - second_address_enabled
        - second_address_window_minutes
        - updated_at
      properties:
        enabled:
          type: boolean
          description: The master switch. false = no rule is evaluated, whatever the two switches below say.
        denials_enabled:
          type: boolean
          description: Rule "denials" on or off.
        denials_threshold:
          type: integer
          minimum: 5
          maximum: 500
          description: This many counted refusals of ONE card inside the window lock the card.
        denials_window_minutes:
          type: integer
          minimum: 1
          maximum: 60
          description: Length of the window, in minutes. A fixed window - one refusal fewer than the threshold in every window is never caught.
        second_address_enabled:
          type: boolean
          description: Rule "second address" on or off (off by default - two devices on two networks are common).
        second_address_window_minutes:
          type: integer
          minimum: 1
          maximum: 120
          description: How recently, in minutes, another session of the card must have been used from a different address for the rule to fire.
        updated_at:
          description: When the company last changed these settings. null = never - the values shown are the defaults.
          anyOf:
            - *a5
            - type: "null"
    UpdateAnomalySettingsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Only the settings given are changed. A value outside its range is refused (422), not adjusted.
      properties:
        enabled:
          type: boolean
          description: The master switch. false = no rule is evaluated, whatever the two switches below say.
        denials_enabled:
          type: boolean
          description: Rule "denials" on or off.
        denials_threshold:
          type: integer
          minimum: 5
          maximum: 500
          description: This many counted refusals of ONE card inside the window lock the card.
        denials_window_minutes:
          type: integer
          minimum: 1
          maximum: 60
          description: Length of the window, in minutes. A fixed window - one refusal fewer than the threshold in every window is never caught.
        second_address_enabled:
          type: boolean
          description: Rule "second address" on or off (off by default - two devices on two networks are common).
        second_address_window_minutes:
          type: integer
          minimum: 1
          maximum: 120
          description: How recently, in minutes, another session of the card must have been used from a different address for the rule to fire.
    AnomalyEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - card_id
        - card_number
        - occurred_at
        - outcome
        - rule
        - count
      properties:
        id: *a1
        card_id: *a1
        card_number:
          type: string
          description: The card's number, masked as everywhere else (last four digits shown).
        occurred_at: *a5
        outcome:
          type: string
          enum:
            - locked
            - not_locked_last_owner
          description: >-
            What happened to the card AT THAT MOMENT. "locked" - the card was locked (it may have been unlocked since;
            the card itself, getCard, says whether it is locked now, and unlockCard unlocks it). "not_locked_last_owner" -
            the rule fired on the company's last usable Owner card, which a rule never locks.
        rule:
          type: string
          enum:
            - denials
            - second_address
            - unknown
          description: The rule that fired. "unknown" - the stored record names a rule this version does not know.
        count:
          type:
            - "integer"
            - "null"
          description: >-
            For "denials": the counted refusals in the window when the rule fired. For "second_address": the number of
            other live sessions of the card on a different address. null if the record holds no number.
    LeavingDate:
      type: object
      additionalProperties: false
      description: >-
        A person's planned leaving date. "Today" is the current calendar day in UTC. Months are calendar months: the
        same day of the month N months on, or the last day of that month when it has no such day.
      required:
        - person_id
        - leaving_on
        - months_left
        - stage
        - updated_at
      properties:
        person_id: *a1
        leaving_on:
          description: A calendar day without time or zone; null = no date is recorded.
          type:
            - "string"
            - "null"
          format: date
        months_left:
          description: Whole calendar months from today (UTC) to the date - the largest N with today + N months on or before the date; 0 when less than a month away or passed. null = no date.
          type:
            - "integer"
            - "null"
        stage:
          description: >-
            6 = less than 6 months away, 12 = less than 12, 24 = less than 24 (a date exactly 6 months away is stage 12);
            null = 24 months away or more, already passed, or no date.
          anyOf:
            - type: integer
              enum:
                - 6
                - 12
                - 24
            - type: "null"
        updated_at:
          anyOf:
            - *a5
            - type: "null"
    RadarEntry:
      type: object
      additionalProperties: false
      required:
        - person_id
        - display_name
        - department_id
        - leaving_on
        - months_left
        - stage
        - job_roles
        - verified_items
        - interviews_completed
      properties:
        person_id: *a1
        display_name:
          type: string
        department_id:
          anyOf:
            - *a1
            - type: "null"
        leaving_on:
          type: string
          format: date
        months_left:
          type: integer
          description: As in LeavingDate.
        stage:
          type: integer
          enum:
            - 6
            - 12
            - 24
          description: As in LeavingDate. Never null here - only dates less than 24 months away are listed.
        job_roles:
          description: The job roles the person holds. null = the caller may not read who holds which job role (gap:read).
          type:
            - "array"
            - "null"
          items:
            type: string
        verified_items:
          description: >-
            Verified or corrected knowledge items contributed by the person, counted among the items the CALLER may read
            (department, sensitivity). null = the caller may not read knowledge items at all - not "none".
          type:
            - "integer"
            - "null"
        interviews_completed:
          description: Completed interviews with the person that the caller may read. null = the caller may not read interviews.
          type:
            - "integer"
            - "null"
    TopicTemplate:
      type: object
      additionalProperties: false
      required:
        - key
        - name
        - summary
        - topics
        - roles
      properties:
        key:
          type: string
        name:
          type: string
        summary:
          type: string
        topics:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - key
              - name
              - description
            properties:
              key:
                type: string
              name:
                type: string
              description:
                type: string
        roles:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - job_role
              - topics
            properties:
              job_role:
                type: string
              topics:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - key
                    - required
                    - importance
                  properties:
                    key:
                      type: string
                    required:
                      type: boolean
                    importance:
                      type: integer
                      minimum: 1
                      maximum: 3
    TopicTemplateResult:
      type: object
      additionalProperties: false
      required:
        - template_key
        - topics_created
        - created_topic_ids
        - topics_existing
        - topics_skipped
        - links_created
        - links_existing
      properties:
        template_key:
          type: string
        topics_created:
          type: integer
        created_topic_ids:
          type: array
          description: The topics this call created.
          items: *a1
        topics_existing:
          type: integer
          description: Topics of the same name that existed and that the caller may read; they were left as they are and used for the links.
        topics_skipped:
          type: integer
          description: Topics of the same name that are retired or that the caller may not read; they are not touched and not linked.
        links_existing:
          type: integer
          description: Job-role links that existed already and were left alone.
        links_created:
          type: integer
          description: Links between a job role and a topic (the job-role map) this call created.