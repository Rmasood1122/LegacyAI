                cidrs:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: string
                    maxLength: 49
                    pattern: ^[0-9A-Fa-f:.]+(/[0-9]{1,3})?$
        - type: object
          additionalProperties: false
          required:
            - type
            - enabled
            - config
          properties:
            type:
              type: string
              const: read_only
            enabled:
              type: boolean
