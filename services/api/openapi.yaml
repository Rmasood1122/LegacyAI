# LegacyAI API contract - SOURCE OF TRUTH.
# The server loads this file at start-up and validates every request against it.
# Tests validate every response against it, and fail if the set of routes in the
# server differs from the set of operations here.
openapi: 3.1.0
info:
  title: LegacyAI API
  version: 0.1.0
  description: |-
    Phase 1 - identity, cards, access and platform. This file is the source of truth: the server validates every request against it and the test suite validates every response against it.

    Conventions: JSON only; snake_case; ISO-8601 UTC times; errors are RFC 9457 problem details; list endpoints use `limit` + `cursor` and return `{ items, next_cursor }`; state-changing admin endpoints require `Idempotency-Key`; state-changing session requests require `X-CSRF-Token` and an allowed `Origin`.

    Extensions: `x-permission` is the permission the policy decision point checks; `x-public` marks the short allow-list of endpoints without a session; `x-idempotent` marks endpoints that require an idempotency key.
servers:
  - url: /
tags:
  - name: health
  - name: auth
  - name: cards
  - name: roles
  - name: people
  - name: tenants
  - name: audit
  - name: export
  - name: internal
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness. Never touches the database.
      tags:
        - health
      x-public: true
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/ready:
    get:
      operationId: getReady
      summary: "Readiness: database reachable, migrations current, config loaded."
      tags:
        - health
      x-public: true
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/auth/login/begin:
    post:
      operationId: loginBegin
      summary: Start a login. Response is identical in shape for known and unknown card numbers.
      tags:
        - auth
      x-public: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBeginRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginBeginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/auth/login/verify:
    post:
      operationId: loginVerify
      summary: "Finish a login: SC and a strong factor in ONE request. Every failure is the same generic 401."
      tags:
        - auth
      x-public: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginVerifyRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/auth/enrollment/begin:
    post:
      operationId: enrollmentBegin
      summary: Start attaching a strong factor using a one-time enrollment token.
      tags:
        - auth
      x-public: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentBeginRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentBeginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/auth/enrollment/complete:
    post:
      operationId: enrollmentComplete
      summary: Prove the new factor works. Activates an issued card. Does not create a session.
      tags:
        - auth
      x-public: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentCompleteRequest"
      responses:
        "204":
          description: Success, no content
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/auth/session:
    get:
      operationId: getSession
      summary: Current session, roles, permissions and CSRF token.
      tags:
        - auth
      x-permission: self:read
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/auth/logout:
    post:
      operationId: logout
      summary: End the current session.
      tags:
        - auth
      x-permission: self:logout
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Success, no content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/auth/credentials:
    get:
      operationId: listOwnCredentials
      summary: List own strong factors (no key material).
      tags:
        - auth
      x-permission: self:read
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Credential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/auth/credentials/{credential_id}:
    delete:
      operationId: removeOwnCredential
      summary: Remove one of own strong factors. Refused if it is the last one.
      tags:
        - auth
      x-permission: self:credential_remove
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "204":
          description: Success, no content
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/cards:
    post:
      operationId: issueCard
      summary: Issue a person card. Card number, SC and enrollment token are shown once.
      tags:
        - cards
      x-permission: card:issue
      security:
        - sessionCookie: []
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueCardRequest"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardWithSecrets"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    get:
      operationId: listCards
      summary: List cards the caller may see.
      tags:
        - cards
      x-permission: card:list
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/FilterState"
        - $ref: "#/components/parameters/FilterKind"
        - $ref: "#/components/parameters/FilterPersonId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                  - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Card"
                  next_cursor:
                    anyOf:
                      - type: string
                      - type: "null"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/cards/{card_id}:
    get:
      operationId: getCard
      summary: Read one card.
      tags:
        - cards
      x-permission: card:read
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CardId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/cards/{card_id}/suspend:
    post:
      operationId: suspendCard
      summary: Suspend a card. Its sessions are revoked.
      tags:
        - cards
      x-permission: card:suspend
      security:
        - sessionCookie: []
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/cards/{card_id}/reinstate:
    post:
      operationId: reinstateCard
      summary: Reinstate a suspended card.
      tags:
        - cards
      x-permission: card:reinstate
      security:
        - sessionCookie: []
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/cards/{card_id}/revoke:
    post:
      operationId: revokeCard
      summary: Revoke a card permanently.
      tags:
        - cards
      x-permission: card:revoke
      security:
        - sessionCookie: []
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/cards/{card_id}/replace:
    post:
      operationId: replaceCard
      summary: "Replace a card: new number and SC; the old card dies at once."
      tags:
        - cards
      x-permission: card:replace
      security:
        - sessionCookie: []
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceCardRequest"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardWithSecrets"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/cards/{card_id}/renew:
    post:
      operationId: renewCard
      summary: Renew a card and rotate its SC. Old SC is invalid immediately; new SC shown once.
      tags:
        - cards
      x-permission: card:renew
      security:
        - sessionCookie: []
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewCardRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardWithSecrets"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/cards/{card_id}/unlock:
    post:
      operationId: unlockCard
      summary: Unlock a locked card. Always rotates the SC.
      tags:
        - cards
      x-permission: card:unlock
      security:
        - sessionCookie: []
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardWithSecrets"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/cards/{card_id}/enrollment-token:
    post:
      operationId: issueEnrollmentToken
      summary: Issue a one-time enrollment token (credential reset).
      tags:
        - cards
      x-permission: card:reset_credentials
      security:
        - sessionCookie: []
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentTokenRequest"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/cards/{card_id}/events:
    get:
      operationId: listCardEvents
      summary: Usage history of a card.
      tags:
        - cards
      x-permission: card_events:read
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/FilterEventType"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                  - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CardEvent"
                  next_cursor:
                    anyOf:
                      - type: string
                      - type: "null"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/cards/{card_id}/restrictions:
    get:
      operationId: getCardRestrictions
      summary: Restrictions on a card and current usage counters.
      tags:
        - cards
      x-permission: card_restrictions:read
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CardId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardRestrictions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      operationId: putCardRestrictions
      summary: Replace the restrictions on a card.
      tags:
        - cards
      x-permission: card_restrictions:update
      security:
        - sessionCookie: []
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutCardRestrictionsRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardRestrictions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/roles:
    get:
      operationId: listRoles
      summary: The 8 roles, whether each is enabled for this tenant, and their permissions.
      tags:
        - roles
      x-permission: role:read
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/cards/{card_id}/roles:
    get:
      operationId: listCardRoles
      summary: Roles assigned to a card.
      tags:
        - roles
      x-permission: card_roles:read
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CardId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoleAssignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: assignCardRole
      summary: Assign one role. The target card's sessions are revoked.
      tags:
        - roles
      x-permission: card_roles:assign
      security:
        - sessionCookie: []
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleAssignmentInput"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      operationId: replaceCardRoles
      summary: Replace the full set of roles on a card.
      tags:
        - roles
      x-permission: card_roles:assign
      security:
        - sessionCookie: []
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - roles
              properties:
                roles:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items:
                    $ref: "#/components/schemas/RoleAssignmentInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoleAssignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
