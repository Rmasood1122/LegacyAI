      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InterviewId:
      name: interview_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestionId:
      name: question_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AnswerId:
      name: answer_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConsentId:
      name: consent_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TopicId:
