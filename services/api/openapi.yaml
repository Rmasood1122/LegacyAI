    Money:
      description: An amount of money. Always a whole number in the SMALLEST unit of the currency (cents), never a fraction. No tax is included anywhere.
      type: object
      additionalProperties: false
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
          minimum: 0
        currency:
          description: ISO 4217 code.
          type: string
          pattern: "^[A-Z]{3}$"
    Subscription:
      type: object
      additionalProperties: false
      required: [plan, seats_requested, seat_limit, seats_unlimited, seats_used, seat_state, auto_renew, term_days, expires_at, renewal_due, grace_until, read_only, export_only, phase, next_term, due_now, open_invoice, can_renew_now, payments_available, payments_needing_attention, if_nothing_is_done]
      properties:
        plan:
          description: Null when the company's plan has no entry in the price catalogue.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [code, name, price_per_seat, placeholder]
              properties:
                code:
                  type: string
                name:
                  type: string
                price_per_seat:
                  description: Per seat and per term.
                  $ref: "#/components/schemas/Money"
                placeholder:
                  description: True while names and prices are invented placeholders, not the founder's decision.
                  type: boolean
        seats_requested:
          description: What the Owner asked for (see updateSubscription). Null = nothing asked. It is used up when an invoice takes effect.
          type:
            - "integer"
            - "null"
        seat_limit:
          description: How many person cards the company may hold now - the seats paid for this term. Null = no limit applies (a new company in its first term, or removed by the operator).
          type:
            - "integer"
            - "null"
        seats_unlimited:
          description: True when the platform operator removed the seat limit.
          type: boolean
        seats_used:
          description: Person cards in use (not revoked, not replaced).
          type: integer
        seat_state:
          description: "`near` = at most one seat or a tenth of the seats is left; `reached` = no card can be issued (issueCard answers 409 `seat-limit-reached`). While a renewal invoice waits to be paid, its seats bound issuing too - also in a company's first term."
          type: string
          enum: [not_limited, ok, near, reached]
        auto_renew:
          type: boolean
        term_days:
          description: Length of one term in days (the company's card validity period).
          type: integer
        expires_at:
          description: The one renewal date of the company - the end of the term (UTC). Same meaning as in the session.
          type: string
          format: date-time
        renewal_due:
          description: From this moment on the Owner can renew (UTC). Same meaning as in the session.
          type: string
          format: date-time
        grace_until:
          description: After `expires_at` the company is read-only until this moment; then only the Owner's export works (UTC). Same meaning as in the session.
          type: string
          format: date-time
        read_only:
          description: True in the phases `grace` and `lapsed`.
          type: boolean
        export_only:
          description: True in the phase `lapsed`.
          type: boolean
        phase:
          description: "`normal`: before `renewal_due`. `renewal_open`: from `renewal_due` to `expires_at`. `grace`: until `grace_until` (read-only). `lapsed`: after it (export only)."
          type: string
          enum: [normal, renewal_open, grace, lapsed]
        next_term:
          description: What the next term would cost if it were invoiced today. Null when the plan has no price.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [seats, amount]
              properties:
                seats:
                  description: The seats asked for or paid before, and never fewer than the cards in use.
                  type: integer
                amount:
                  $ref: "#/components/schemas/Money"
        due_now:
          description: What startRenewal would invoice right now. Null = nothing is due (409 `renewal-not-open`).
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [kind, seats, amount]
              properties:
                kind:
                  type: string
                  enum: [renewal, seats]
                seats:
                  description: "For `renewal`: the seats of the new term. For `seats`: the number of seats ADDED."
                  type: integer
                amount:
                  $ref: "#/components/schemas/Money"
        open_invoice:
          description: The unpaid invoice, if one is waiting.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Invoice"
        can_renew_now:
          description: True when something is due and no invoice is open. The screen needs no rule of its own.
          type: boolean
        payments_available:
          description: False when no payment provider is connected; an invoice is then settled by the platform operator.
          type: boolean
        payments_needing_attention:
          description: Payments on record that did not take effect (arrived late, or could not be applied). The platform operator resolves them.
          type: integer
        if_nothing_is_done:
          type: string
          enum: [automatic_renewal_is_tried, read_only_then_export_only]
    UpdateSubscriptionRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        seats:
          type: integer
          minimum: 1
          maximum: 100000
        auto_renew:
          type: boolean
    SeatLimitRequest:
      type: object
      additionalProperties: false
      required: [seat_limit]
      properties:
        seat_limit:
          description: Null removes the limit.
          type:
            - "integer"
            - "null"
          minimum: 1
          maximum: 100000
    Invoice:
      type: object
      additionalProperties: false
      required: [id, number, kind, status, plan_code, seats, term_days, amount, automatic, settlement, issued_at, paid_at, closed_at, applied]
      properties:
        id:
          type: string
          format: uuid
        number:
          description: Counts up per company, starting at 1. Numbers of closed invoices are not reused.
          type: integer
        kind:
          description: "`renewal`: the next term. `seats`: seats added to the running term."
          type: string
          enum: [renewal, seats]
        status:
          description: >-
            `open`: waiting to be paid (a company has at most one). `paid`: final. `failed`: the payment was
            declined; final for this invoice - a new attempt gets a new invoice. `void`: closed without payment
            (replaced by a newer invoice, or too old). `paid_late`: money arrived for an invoice that was already
            failed or void; it is on record and is NOT applied unless the platform operator applies it.
          type: string
          enum: [open, paid, failed, void, paid_late]
        plan_code:
          type: string
        seats:
          description: "For `renewal`: the seats of the term. For `seats`: the number of seats added."
          type: integer
        term_days:
          type: integer
        amount:
          description: Never changes after the invoice was issued.
          $ref: "#/components/schemas/Money"
        automatic:
          description: True when the automatic renewal created it.
          type: boolean
        settlement:
          description: "Who settled it: the payment provider, the platform operator by hand, or nobody (`no_charge`: the amount was 0). Null until paid."
          type:
            - "string"
            - "null"
          enum: [provider, operator, no_charge, null]
        issued_at:
          type: string
          format: date-time
        paid_at:
          type:
            - "string"
            - "null"
          format: date-time
        closed_at:
          type:
            - "string"
            - "null"
          format: date-time
        applied:
          description: True once the invoice took effect (the term was renewed, or the seats were added). It happens once. A paid invoice with `applied` false needs the platform operator.
          type: boolean
    RenewalStarted:
      type: object
      additionalProperties: false
      required: [invoice, already_open, collected_by]
      properties:
        invoice:
          $ref: "#/components/schemas/Invoice"
        already_open:
          description: True when the company already had an unpaid invoice for exactly this; that one is returned and nothing new was issued.
          type: boolean
        collected_by:
          description: "`provider`: the payment provider was asked to collect it. `operator`: no provider is connected; the platform operator records the payment."
          type: string
          enum: [provider, operator]
    PaymentEventRequest:
      description: The message format of the stand-in provider. A real provider's own format is translated to the same facts inside the API.
      type: object
      additionalProperties: false
      required: [version, event_id, tenant_id, invoice_id, outcome, amount_minor, currency, sent_at, signature]
      properties:
        version:
          description: The version of this format; it is part of what is signed.
          type: string
          enum: [v1]
        event_id:
          description: The provider's own id of this message; a message is applied once per id.
          type: string
          pattern: "^[A-Za-z0-9_-]{8,100}$"
        tenant_id:
          type: string
          format: uuid
        invoice_id:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [paid, declined]
        amount_minor:
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        sent_at:
          description: When the message was sent (UTC). More than five minutes from now is refused.
          type: string
          format: date-time
        signature:
          description: "HMAC-SHA256, in hex, over these fields joined by line breaks, in this order: version, event_id, tenant_id, invoice_id, outcome, amount_minor, currency, sent_at."
          type: string
          pattern: "^[0-9a-f]{64}$"
    TenantBilling:
      type: object
      additionalProperties: false
      required: [tenant_id, subscription, invoices, next_cursor]
      properties:
        tenant_id:
          type: string
          format: uuid
        subscription:
          $ref: "#/components/schemas/Subscription"
        invoices:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
        next_cursor:
          description: For the next page of invoices.
          type:
            - "string"
            - "null"
    ManualPaymentRequest:
      type: object
      additionalProperties: false
      required: [invoice_id, amount, reference]
      properties:
        invoice_id:
          type: string
          format: uuid
        amount:
          description: What was paid. It must be exactly what the invoice says.
          $ref: "#/components/schemas/Money"
        reference:
          description: Where the payment is recorded (a transfer or case id). Never a payment card number.
          type: string
          minLength: 3
          maxLength: 200
        discard_remaining_days:
          description: Needed to renew while the running term still has days left (the new term starts today).
          type: boolean
