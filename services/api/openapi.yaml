          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required:
              - "topic_id"
              - "name"
              - "link_source"
            properties:
              topic_id:
                type: "string"
                format: "uuid"
              name:
                type: "string"
              link_source:
                type: "string"
                enum:
                  - "similarity"
                  - "reviewer"
    KItemTopics:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "topics"
      properties:
        id:
          type: "string"
          format: "uuid"
        topics:
          type: "array"
