                format: "uuid"
              chunk_count:
                type: "integer"
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - request_id
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        request_id:
          type: string
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - path
              - message
            properties:
              path:
                type: string
              message:
                type: string
      description: RFC 9457 problem details. Never contains internal detail.
    Health:
      type: object
      additionalProperties: false
      required:
        - status
        - version
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
    Ready:
      type: object
      additionalProperties: false
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        checks:
          type: object
          additionalProperties: false
          required:
            - database
            - migrations
            - config
          properties:
            database:
              type: boolean
            migrations:
              type: boolean
            config:
              type: boolean
    LoginBeginRequest:
      type: object
      additionalProperties: false
      required:
        - card_number
      properties:
        card_number: &a6
          type: string
          minLength: 16
          maxLength: 32
          description: Card number. Accepted with or without the LGY- prefix, spaces or dashes.
    LoginBeginResponse:
      type: object
      additionalProperties: false
      required:
        - login_txn
        - webauthn_options
        - totp_allowed
        - expires_in
      properties:
        login_txn:
          type: string
        webauthn_options: &a2
          type: object
          additionalProperties: true
        totp_allowed:
          type: boolean
          const: true
        expires_in:
          type: integer
    LoginVerifyRequest:
      type: object
      additionalProperties: false
      required:
        - login_txn
        - sc
        - factor
      properties:
        login_txn:
          type: string
          minLength: 20
          maxLength: 200
        sc: &a7
          type: string
          pattern: ^[0-9]{3}$
          description: 3-digit secret code. Only ever a second factor.
        factor:
          description: REQUIRED strong factor. Card number + SC alone never authenticates.
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - type
                - assertion
              properties:
                type:
                  type: string
                  const: passkey
                assertion: *a2
            - type: object
              additionalProperties: false
              required:
                - type
                - code
              properties:
                type:
                  type: string
                  const: totp
                code:
                  type: string
                  pattern: ^[0-9]{6}$
    Session:
      type: object
      additionalProperties: false
      required:
        - card_id
        - tenant_id
        - person_id
        - card_number_masked
        - roles
        - permissions
        - card_state
        - read_only
        - export_only
        - expires_at
        - grace_until
        - renewal_due
        - session_idle_expires_at
        - session_absolute_expires_at
        - csrf_token
      properties:
        card_id: *a1
        tenant_id: *a1
        person_id:
          description: The person this card belongs to (null for a company card). Lets a client name the signed-in person as the contributor of their own material.
          type:
            - "string"
            - "null"
          format: "uuid"
        card_number_masked:
          type: string
        roles:
          type: array
          items: *a3
        permissions:
          type: array
          items:
            type: string
        card_state: *a4
        read_only:
          type: boolean
        export_only:
          type: boolean
        expires_at: &a5
          type: string
          format: date-time
        grace_until: *a5
        renewal_due: *a5
        session_idle_expires_at: *a5
        session_absolute_expires_at: *a5
        csrf_token:
          type: string
    EnrollmentBeginRequest:
      type: object
      additionalProperties: false
      required:
        - card_number
        - sc
        - enrollment_token
        - factor_type
      properties:
        card_number: *a6
        sc: *a7
        enrollment_token:
          type: string
          minLength: 20
          maxLength: 200
        factor_type:
          type: string
          enum:
            - passkey
            - totp
        label:
          type: string
          maxLength: 80
    EnrollmentBeginResponse:
      type: object
      additionalProperties: false
      required:
        - enrollment_txn
        - factor_type
      properties:
        enrollment_txn:
          type: string
        factor_type:
          type: string
          enum:
            - passkey
            - totp
        webauthn_options: *a2
        totp:
          type: object
          additionalProperties: false
          required:
            - secret
            - otpauth_uri
          properties:
            secret:
              type: string
            otpauth_uri:
              type: string
    EnrollmentCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - enrollment_txn
      properties:
        enrollment_txn:
          type: string
          minLength: 20
          maxLength: 200
        attestation: *a2
        totp_code:
          type: string
          pattern: ^[0-9]{6}$
    Credential:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - label
        - created_at
        - last_used_at
      properties:
        id: *a1
        type:
          type: string
          enum:
            - passkey
            - totp
        label:
          type: string
        created_at: *a5
        last_used_at:
          anyOf:
            - *a5
            - type: "null"
    RoleAssignmentInput:
      type: object
      additionalProperties: false
      required:
        - role_key
      properties:
        role_key: *a3
        department_id:
          anyOf:
            - *a1
            - type: "null"
    RoleAssignment:
      type: object
      additionalProperties: false
      required:
        - role_key
        - department_id
        - assigned_at
      properties:
        role_key: *a3
        department_id:
          anyOf:
            - *a1
            - type: "null"
        assigned_at: *a5
    Role:
      type: object
      additionalProperties: false
      required:
        - role_key
        - display_name
        - rank
        - enabled_for_tenant
        - permissions
      properties:
        role_key: *a3
        display_name:
          type: string
        rank:
          type: integer
        enabled_for_tenant:
          type: boolean
        permissions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - permission_key
              - scope
            properties:
              permission_key:
                type: string
              scope:
                type: string
                enum:
                  - tenant
                  - department
                  - own
    Card:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - card_number
        - state
        - person_id
        - issued_at
        - activated_at
        - expires_at
        - grace_until
        - renewal_due
        - renewal_count
        - lock_reason
        - locked
        - replaced_by_card_id
        - replaces_card_id
        - roles
      properties:
        id: *a1
        kind:
          type: string
          enum:
            - person
            - company
        card_number:
          type: string
          pattern: ^LGY-[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{4}$
        state: *a4
        person_id:
          anyOf:
            - *a1
            - type: "null"
        issued_at: *a5
        activated_at:
          anyOf:
            - *a5
            - type: "null"
        expires_at: *a5
        grace_until: *a5
        renewal_due: *a5
        renewal_count:
          type: integer
        locked:
          type: boolean
        lock_reason:
          description: Why the card is locked - wrong secret codes, an admin, or an anomaly rule; null when it is not locked.
          type:
            - "string"
            - "null"
          enum:
            - sc_attempts
            - admin
            - anomaly
            - null
        replaced_by_card_id:
          anyOf:
            - *a1
            - type: "null"
        replaces_card_id:
          anyOf:
            - *a1
            - type: "null"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleAssignment"
    CardWithSecrets:
      type: object
      additionalProperties: false
      required:
        - card
        - secret_already_shown
      properties:
        card:
          $ref: "#/components/schemas/Card"
        sc:
          type: string
          pattern: ^[0-9]{3}$
          description: Shown ONCE. Never stored in readable form, never returned again.
        enrollment_token:
          type: string
          description: Shown ONCE.
        enrollment_token_expires_at: *a5
        secret_already_shown:
          type: boolean
          description: "True on an idempotent replay: the one-time secrets are not repeated."
    IssueCardRequest:
      type: object
      additionalProperties: false
      required:
        - person_id
        - roles
      properties:
        person_id: *a1
        roles:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: "#/components/schemas/RoleAssignmentInput"
    ReasonRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
    ReplaceCardRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          enum:
            - lost
            - damaged
            - compromised
        reset_credentials:
          type: boolean
    RenewCardRequest:
      type: object
      additionalProperties: false
      required: []
      properties:
        validity_days:
          type: integer
          minimum: 1
          maximum: 366
    OwnerRecoveryRequest:
      type: object
      additionalProperties: false
      required:
        - verification_reference
      oneOf:
        - required:
            - card_id
        - required:
            - card_number
      properties:
        card_id: *a1
        card_number: *a6
        verification_reference:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{5,63}$
          description: The id of the operator's own record of the out-of-band identity check (a ticket or case number). An identifier only - never a name, phone number or other personal data. Written to the audit log of both tenants.
    OwnerRecoveryResult:
      type: object
      additionalProperties: false
      required:
        - card
        - secret_already_shown
        - notified_owner_count
      properties:
        card:
          $ref: "#/components/schemas/Card"
        sc:
          type: string
          pattern: ^[0-9]{3}$
          description: Shown ONCE.
        enrollment_token:
          type: string
          description: Shown ONCE.
        enrollment_token_expires_at: *a5
        secret_already_shown:
          type: boolean
          description: "True on an idempotent replay: the one-time secrets are not repeated."
        notified_owner_count:
          type: integer
          minimum: 0
          description: How many other Owners of the company were notified.
    EnrollmentTokenRequest:
      type: object
      additionalProperties: false
      required: []
      properties:
        revoke_existing:
          type: boolean
    EnrollmentTokenResponse:
      type: object
      additionalProperties: false
      required:
        - secret_already_shown
      properties:
        enrollment_token:
          type: string
        enrollment_token_expires_at: *a5
        secret_already_shown:
          type: boolean
    CardEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - card_id
        - occurred_at
        - event_type
        - actor_card_id
        - credential_id
        - device
        - request_id
        - metadata
      properties:
        id: *a1
        card_id: *a1
        occurred_at: *a5
        event_type:
          type: string
        actor_card_id:
          anyOf:
            - *a1
            - type: "null"
        credential_id:
          anyOf:
            - *a1
            - type: "null"
        device:
          anyOf:
            - type: string
              description: Short fingerprint of the device; not an address.
            - type: "null"
        request_id:
          anyOf:
            - type: string
            - type: "null"
        metadata: *a2
    Restriction:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - type
            - enabled
            - config
          properties:
            type:
              type: string
              const: usage_cap
            enabled:
              type: boolean
            config:
              type: object
              additionalProperties: false
              required:
                - limit_key
                - window_seconds
                - max_count
              properties:
                limit_key:
                  type: string
                  enum:
                    - requests
                    - writes
                    - exports
                window_seconds:
                  type: integer
                  minimum: 60
                  maximum: 2678400
                max_count:
                  type: integer
                  minimum: 0
                  maximum: 1000000
        - type: object
          additionalProperties: false
          required:
            - type
            - enabled
            - config
          properties:
            type:
              type: string
              const: time_window
            enabled:
              type: boolean
            config:
              type: object
              additionalProperties: false
              required:
                - timezone
                - days
                - start
                - end
              properties:
                timezone:
                  type: string
                  maxLength: 64
                days:
                  type: array
                  minItems: 1
                  maxItems: 7
                  uniqueItems: true
                  items:
                    type: integer
                    minimum: 0
                    maximum: 6
                start:
                  type: string
                  pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                end:
                  type: string
                  pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        - type: object
          additionalProperties: false
          required:
            - type
            - enabled
            - config
          properties:
            type:
              type: string
              const: network_allowlist
            enabled:
              type: boolean
            config:
              type: object
              additionalProperties: false
              required:
                - cidrs
              properties:
                cidrs:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: string
                    maxLength: 49
                    pattern: ^[0-9A-Fa-f:.]+(/[0-9]{1,3})?$
        - type: object
          additionalProperties: false
          required:
            - type
            - enabled
            - config
          properties:
            type:
              type: string
              const: read_only
            enabled:
              type: boolean
            config:
              type: object
              additionalProperties: false
              required: []
              properties: {}
    PutCardRestrictionsRequest:
      type: object
      additionalProperties: false
      required:
        - restrictions
      properties:
        restrictions:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Restriction"
    CardRestrictions:
      type: object
