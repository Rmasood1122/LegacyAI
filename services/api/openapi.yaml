  /v1/knowledge/graph:
    get:
      operationId: "getGraphNeighbourhood"
      summary: "One node of the knowledge map and what it is directly linked to, in groups. Nodes are topics, knowledge items, documents and job roles; links are the ones that already exist (item - topic, item - document it cites, job role - topic, item - item conflict). Nothing is inferred, and people are not nodes. Only what the caller may read is returned. A node the caller may not read answers 404, like one that does not exist; in the same way a neighbour hidden from the caller and a neighbour that does not exist cannot be told apart - an empty group means 'nothing you may read', not 'nothing'. Each group holds at most `limit_per_group` (50) nodes and says with `truncated` when there are more; the rest of such a group cannot be reached through this operation."
      tags:
        - "knowledge"
      x-permission: "knowledge:read"
      security:
        - sessionCookie: []
      parameters:
        - name: "kind"
          in: "query"
          required: true
          schema:
            $ref: "#/components/schemas/KGraphNodeKind"
          description: "What kind of node `id` names."
        - name: "id"
          in: "query"
          required: true
          schema:
            $ref: "#/components/schemas/JobRoleName"
          description: "The id of the topic, item or document; for a job role, its name (the same rule as a job-role name everywhere)."
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/KGraphNeighbourhood"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"
  /v1/knowledge/graph/export:
    post:
      operationId: "exportKnowledgeGraph"
      summary: "Take the whole knowledge map the caller may read out of the product, as one file in an open, documented JSON shape (KGraphExport, `schema` legacyai-knowledge-graph/1). This is an EXPORT: it needs the right to export (export:create - the Company Owner), is still narrowed by the caller's own rights to read knowledge and topics, is written to the audit log (action knowledge:graph_export, with the number of nodes and links only), and may be done at most 5 times an hour per card (429 after that). It is a second, smaller kind of export next to POST /v1/exports (the company's data export): it runs at once, returns its content in the answer and creates no export job. Caps: 2000 nodes of each kind (items, topics, documents, job roles) and 10000 links in all; `truncated` says a cap was reached. Not idempotent: each call is a new export and a new audit entry."
      tags:
        - "knowledge"
      x-permission: "export:create"
      security:
        - sessionCookie: []
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
