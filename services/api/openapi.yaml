components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-lai_session
    serviceBearer:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9_.:-]+$
      description: Client-chosen key. Same key + same request replays the stored response; same key + different request is a 409.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Page size.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
      description: Opaque cursor from a previous page.
    CardId:
      name: card_id
      in: path
      required: true
      schema: &a1
        type: string
        format: uuid
    PersonId:
      name: person_id
      in: path
      required: true
      schema: *a1
    ExportId:
      name: export_id
      in: path
      required: true
      schema: *a1
    CredentialId:
      name: credential_id
      in: path
      required: true
      schema: *a1
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema: *a1
    RoleKey:
      name: role_key
      in: path
      required: true
      schema: &a3
        type: string
        enum:
          - company_owner
          - admin
          - department_manager
          - auditor
          - reviewer
          - expert
          - successor
          - contractor
    FilterState:
      name: state
      in: query
      required: false
      schema: &a4
        type: string
        enum:
          - issued
          - active
          - suspended
          - revoked
          - expired
          - replaced
      description: Filter by stored state.
    FilterKind:
      name: kind
      in: query
      required: false
      schema:
        type: string
        enum:
          - person
          - company
    FilterPersonId:
      name: person_id
      in: query
      required: false
      schema: *a1
    FilterEventType:
      name: event_type
      in: query
      required: false
      schema:
        type: string
        maxLength: 40
    FilterDepartmentId:
      name: department_id
      in: query
      required: false
      schema: *a1
    FilterPersonStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - active
          - departed
    FilterActorCardId:
      name: actor_card_id
      in: query
      required: false
      schema: *a1
    FilterAction:
      name: action
      in: query
      required: false
      schema:
        type: string
        maxLength: 60
    FilterResourceType:
      name: resource_type
      in: query
      required: false
      schema:
        type: string
        maxLength: 60
    FilterResourceId:
      name: resource_id
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
    FilterDecision:
      name: decision
      in: query
      required: false
      schema:
        type: string
        enum:
          - allow
          - deny
          - event
  responses:
    BadRequest:
      description: The request does not match the contract.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Not signed in, or sign-in failed. Deliberately generic.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Not allowed. Deliberately generic.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such resource (also returned for resources in another tenant).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: "Conflict: illegal state transition, duplicate, or idempotency key reused with a different request."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: The request is well-formed but breaks a rule.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit reached. Uniform response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      headers:
        Retry-After:
          schema:
            type: integer
    Unavailable:
      description: Not ready.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - request_id
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        request_id:
          type: string
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - path
              - message
            properties:
              path:
                type: string
              message:
                type: string
      description: RFC 9457 problem details. Never contains internal detail.
    Health:
      type: object
      additionalProperties: false
      required:
        - status
        - version
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
    Ready:
      type: object
      additionalProperties: false
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        checks:
          type: object
          additionalProperties: false
          required:
            - database
            - migrations
            - config
          properties:
            database:
              type: boolean
            migrations:
              type: boolean
            config:
              type: boolean
